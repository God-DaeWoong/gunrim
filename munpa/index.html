<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>군림천하 문파 경영</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231d1a16'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='%23b8862b' font-family='serif'>宗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1e9d8; --paper2:#e8dcc3; --card:#fbf6ea; --ink:#1d1a16; --ink2:#4a443b; --muted:#857a68;
  --red:#a3312a; --gold:#b8862b; --green:#3d7a5a; --blue:#2f6f9f; --line:#c9b994;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:15px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--ink2);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--ink);color:var(--paper)}
h1,h2,h3{font-family:'Nanum Myeongjo',serif;margin:.4em 0}
.serif{font-family:'Nanum Myeongjo',serif}
.muted{color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px}
.top b{color:#e7c77a}
.bar{display:inline-block;width:110px;height:8px;background:#4a443b;border-radius:4px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{white-space:nowrap;flex:none}@media (max-width:600px){.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}.tabs button{padding:6px 10px}}
.tabs button.on{background:var(--ink);color:var(--paper)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.d .hd{display:flex;gap:8px;align-items:center}
.pt{width:44px;height:44px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;font-family:'Nanum Myeongjo',serif;font-weight:800;overflow:hidden;flex:none}
.pt img{width:100%;height:100%;object-fit:cover;object-position:top}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin:2px 2px 0 0}
.chip.s{border-color:var(--blue);color:var(--blue)}
.chip.m{border-color:var(--red);color:var(--red)}
.chip.b{border-color:var(--green);color:var(--green)}
.mind{height:5px;background:var(--paper2);border-radius:3px;margin-top:6px;overflow:hidden}
.mind i{display:block;height:100%;background:var(--red)}
select{font-family:inherit;font-size:13px;padding:3px}
.ev{border-left:4px solid var(--ink2)}
.ev.crisis{border-left-color:var(--red)}
.ev.job{border-left-color:var(--green)}
.ev.task{border-left-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(29,26,22,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:12px;max-width:560px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto}
.modal .box p{line-height:1.8}
.modal .ch{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .ch button{text-align:left}
.log{font-size:13px;line-height:1.7;max-height:220px;overflow:auto}
.box.duel.gorge{background:linear-gradient(rgba(20,12,10,.55),rgba(20,12,10,.78)),url(img/gorge.webp) center/cover;color:#f4ead8}
.box.duel.gorge h2,.box.duel.gorge .duelside b,.box.duel.gorge p b{color:#fff3dc}.box.duel.gorge>.muted,.box.duel.gorge .duelside .muted,.box.duel.gorge p.muted{color:#d8c8b0}.box.duel.gorge button{color:#1d1a16}.box.duel.gorge button b{color:#1d1a16}.box.duel.gorge button .muted{color:#7a6a55}.box.duel.gorge .log{background:rgba(0,0,0,.35);padding:6px 8px;border-radius:6px}
.box.duel.gorge .duelside .pt{background:rgba(241,233,216,.15)}.box.duel.gorge .vs{color:#ff8a6a;text-shadow:0 0 8px #000}
.duelrow{display:flex;align-items:center;justify-content:space-around;gap:10px;margin-top:10px}
.box.duel.gorge.bimu{background:linear-gradient(rgba(16,14,20,.55),rgba(16,12,10,.82)),url(img/sd_gate_bg.webp) center/cover}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.ccard{width:138px;min-height:108px;background:#f1e9d8;color:#1d1a16;border-radius:10px;padding:8px 8px 6px;border:2px solid #8a6a3a;cursor:pointer;position:relative;transition:transform .12s;display:flex;flex-direction:column;gap:2px;text-align:left}
.ccard:hover{transform:translateY(-6px)}.ccard.off{opacity:.45;cursor:not-allowed;transform:none}.ccard.def{border-color:#3d6ea0}.ccard.ult{border-color:#c9a227;box-shadow:0 0 10px rgba(217,178,90,.6)}
.ccard .cost{position:absolute;top:-9px;left:-9px;width:26px;height:26px;border-radius:50%;background:#2d4f7c;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #f1e9d8}
.ccard b{font-size:14px;color:#1d1a16}.ccard i{font-style:normal;font-size:11px;color:#7a5a2a}.ccard small{font-size:12px;color:#1d1a16}
.intent{padding:2px 10px;border-radius:12px;background:rgba(0,0,0,.5);font-size:13px;margin-top:2px}
.pop{position:absolute;top:30px;font-weight:800;font-size:24px;color:#ffdf8a;text-shadow:0 0 6px #000;animation:pop .9s forwards;z-index:4;pointer-events:none}@keyframes pop{to{transform:translateY(-40px);opacity:0}}
.hpb{width:100%}
.box.duel.gorge button.main{background:#1d1a16;color:#f1e9d8;border-color:#d9b25a}.box.duel.gorge button.main:hover{background:#3a2f27}
.fx{position:absolute;width:320px;height:213px;margin-top:-50px;filter:brightness(1.35) saturate(1.3);background-size:300% 200%;pointer-events:none;mix-blend-mode:screen;z-index:2}
.duelside{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:140px}
.duelside .pt{width:72px;height:72px;font-size:28px}
.vs{font-size:32px;color:var(--red)}
.hpb{width:130px;height:8px;background:var(--paper2);border-radius:4px;overflow:hidden}.hpb i{display:block;height:100%;background:var(--red)}
.duelside.hit .pt{animation:hit .35s}@keyframes hit{0%{transform:translateX(0);filter:none}25%{transform:translateX(-8px);filter:brightness(2) sepia(1) hue-rotate(-30deg)}50%{transform:translateX(7px)}100%{transform:translateX(0);filter:none}}
.yard{position:relative;margin:12px 0 4px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#cdbf9f}
.yard canvas{display:block;width:100%;height:250px}
.yard .tip{position:absolute;pointer-events:none;background:rgba(29,26,22,.85);color:#f1e9d8;font-size:12px;padding:2px 6px;border-radius:4px;display:none}
.map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.map>img{display:block;width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;z-index:1}
.pin i{width:10px;height:10px;border-radius:50%;background:#5b4636;border:2px solid #f1e9d8;box-shadow:0 0 0 1px #1d1a16}
.pin span{margin-top:2px;font-size:12px;font-weight:700;color:#1d1a16;background:rgba(241,233,216,.82);padding:0 5px;border-radius:4px;white-space:nowrap}
.pin.hot i{background:var(--red);animation:pinpulse 1.2s infinite}.pin.hot span{background:#fff8e6;border:1px solid var(--red)}
.pin.sel span{background:#1d1a16;color:#f1e9d8}
@keyframes pinpulse{0%{box-shadow:0 0 0 1px #1d1a16,0 0 0 0 rgba(163,49,42,.6)}100%{box-shadow:0 0 0 1px #1d1a16,0 0 0 10px rgba(163,49,42,0)}}
.pds{display:flex;gap:1px;margin-top:2px}.pds img{height:30px;image-rendering:pixelated}.pds em{font-style:normal;font-size:11px;background:#f1e9d8;border:1px solid #1d1a16;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
@media (max-width:600px){.pin span{font-size:10px}}
.next{position:fixed;right:16px;bottom:16px;z-index:6;font-size:16px;padding:12px 20px}
table.cal{border-collapse:collapse;font-size:13px;width:100%}
table.cal td,table.cal th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
@media (max-width:600px){.bar{width:70px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= 데이터 ================= */
// 무공: t = s(심법)/m(초식), cap = 기본 상한
const ARTS={
  yuun:{n:'유운검법',t:'m',w:'geom',cap:7}, yuungyeol:{n:'유운검결',t:'m',w:'geom',cap:10},
  cheonha:{n:'천하삼십육검',t:'m',w:'geom',cap:7}, nakha:{n:'낙하구구검',t:'m',w:'geom',cap:10},
  janggwae:{n:'장괘장권구식',t:'m',w:'gwon',cap:10}, hongdan:{n:'홍단서천',t:'m',w:'geom',cap:10},
  wolnyeo:{n:'월녀검법',t:'m',w:'geom',cap:10}, punghan:{n:'풍한팔식',t:'m',w:'geom',cap:10}, pungroe:{n:'풍뢰도법',t:'m',w:'geom',cap:10}, geombo:{n:'검보 가전검법',t:'m',w:'geom',cap:10}, yakryu:{n:'약류장',t:'m',w:'gwon',cap:10},
  taeeul:{n:'태을신공',t:'s',cap:10}, guyang:{n:'구양신공',t:'s',cap:10},
  hyeoncheong:{n:'현청건곤강기',t:'s',cap:10}, taejin:{n:'태진강기',t:'s',cap:10}, cheondan:{n:'천단신공',t:'s',cap:10},
  muyeom:{n:'무염십팔보',t:'b',cap:2}, janggwaebo:{n:'장괘보',t:'b',cap:2}, eoryong:{n:'이어룡',t:'b',cap:2}, hoeseon:{n:'회선표',t:'b',cap:2}, waseon:{n:'와선보',t:'b',cap:2}, biyeon:{n:'비연신법',t:'b',cap:2}, nanhwa:{n:'난화지',t:'m',w:'gwon',cap:10}, yeomhwa:{n:'염화옥수',t:'m',w:'gwon',cap:10},
  guban:{n:'구반장법',t:'m',w:'gwon',cap:10}, nakroe:{n:'낙뢰신권',t:'m',w:'gwon',cap:10}, chileum:{n:'칠음진기',t:'s',cap:2}
};
// 전수할 수 있는 초식. 가르칠 사람(5성 이상)이 있어야 하고, 천하삼십육검은 충성 70 이상만 배운다
// 상위 무공을 익히면 그 하위 무공은 이미 아는 것으로 친다
const SUPER={yuun:'yuungyeol'},knows=(d,a)=>d.arts[a]!=null||!!(SUPER[a]&&d.arts[SUPER[a]]!=null);
const LIB=['chileum','yuun','cheonha','nakha','janggwae','hongdan','wolnyeo','yakryu','hoeseon','eoryong','janggwaebo','waseon','biyeon','muyeom','nanhwa','yeomhwa','cheondan','taejin'];
const SECRET={cheonha:70,muyeom:70,nanhwa:70,yeomhwa:70,cheondan:70,taejin:70};
// 종남 심법 셋은 모두가 익히고 있고 성취만 다르다. 사부가 후계 후보로 키운 넷은 구양·현청이 1성
const BASE_S=['taeeul','guyang','hyeoncheong'],SENIOR=['lim','mae','so','eung','ak'];
// 제자: apt = 수련 배율, ch = 충성
const ROSTER=[
  {id:'jin',n:'진산월',r:'장문인',rl:'player',st:{tong:85,ji:80,jeong:65,ma:80,geom:95,gwon:70,oseong:80},ch:100,arts:{hoeseon:1,janggwaebo:1,eoryong:1,yuun:6,cheonha:6,nakha:5,janggwae:4,yakryu:3,hongdan:1,taeeul:3,guyang:1,hyeoncheong:1}},
  {id:'lim',n:'임영옥',r:'사매',img:'img/lim.webp',st:{tong:55,ji:75,jeong:45,ma:85,geom:95,gwon:50,oseong:85},ch:95,taeum:1,arts:{hoeseon:1,eoryong:1,yuun:7,wolnyeo:6,taeeul:5}},
  {id:'mae',n:'매상',r:'사제',img:'img/mae.webp',st:{tong:60,ji:45,jeong:30,ma:40,geom:80,gwon:60,oseong:55},ch:80,arts:{waseon:1,cheonha:6,taeeul:5}},
  {id:'so',n:'소지산',r:'사제',img:'img/so.webp',st:{tong:70,ji:55,jeong:55,ma:45,geom:70,gwon:50,oseong:60},ch:90,arts:{eoryong:1,nakha:5,taeeul:4}},
  {id:'eung',n:'응계성',r:'사제',img:'img/eung.webp',st:{tong:50,ji:35,jeong:25,ma:40,geom:45,gwon:80,oseong:45},ch:85,arts:{janggwaebo:1,janggwae:5,taeeul:4}},
  {id:'nak',n:'낙일방',r:'사제',img:'img/nak.webp',st:{tong:45,ji:50,jeong:30,ma:65,geom:40,gwon:95,oseong:70},ch:85,arts:{janggwaebo:1,janggwae:5,taeeul:3}},
  {id:'du',n:'두기춘',r:'사제',img:'img/du.webp',st:{tong:40,ji:80,jeong:70,ma:70,geom:50,gwon:45,oseong:75},ch:35,arts:{eoryong:1,yuun:5,taeeul:4}},
  {id:'jeong',n:'정해',r:'사제',img:'img/jeong.webp',st:{tong:55,ji:80,jeong:75,ma:60,geom:60,gwon:55,oseong:70},ch:80,arts:{waseon:1,yuun:5,taeeul:4}},
  {id:'ak',n:'악자화',r:'사형',img:'img/ak.webp',st:{tong:60,ji:70,jeong:50,ma:55,geom:90,gwon:60,oseong:80},ch:40,arts:{hoeseon:1,waseon:1,yuun:6,cheonha:5,taeeul:5}},
  {id:'bang',n:'방취아',r:'막내',img:'img/bang.webp',st:{tong:30,ji:60,jeong:40,ma:80,geom:65,gwon:45,oseong:65},ch:90,arts:{biyeon:2,hoeseon:1,eoryong:1,wolnyeo:4,taeeul:3}}
];
// 능력치 이름. 무골은 초식, 오성은 심법이 오르는 속도(80이 보통)
const STN={tong:'통솔',ji:'지력',jeong:'정치',ma:'매력',geom:'검재',gwon:'권재',oseong:'오성'};
const growOf=(d,a)=>(ARTS[a].t==='s'?d.st.oseong:ARTS[a].w==='sin'?(d.st.geom+d.st.gwon)/2:d.st[ARTS[a].w]||60)/80;
const POS={train:'수련',guard:'수비',rest:'휴식',study:'장경각 해독',shop:'주루 관리',seclude:'폐관',away:'파견 중',hurt:'요양'};
// 주루 관리: 정치가 높을수록 많이 번다(달마다). 자리는 대왕령 주루 3, 조암령 주루 +4, 초가보가 쥐던 주루 +2, 서안 객잔 +1(최대 10)
const secMul=()=>G.flags.sulyeon?3:2.5,secSlots=()=>(G.flags.yeongong?1:0)+(G.flags.sulyeon?1:0);
const shopSlots=()=>{const dd=G.devDone||[];return 3+(dd.includes('ju')?4:0)+(dd.includes('land')?2:0)+(dd.includes('sang')?1:0)};
const shopEarn=()=>G.ds.filter(d=>d.pos==='shop').map(d=>Math.round(d.st.jeong/6+d.st.ji/20)).sort((a,b)=>b-a).slice(0,shopSlots()).reduce((s,v)=>s+v,0);
const FAC={yeon:{n:'연무장',d:'수련치 +10%/단계'},jang:{n:'장경각',d:'해독 속도, 전수할 수 있는 무공 수'},yak:{n:'약방',d:'심마·부상 회복'},oe:{n:'외당',d:'본산 방어, 잠입 차단, 사건을 일찍 앎'}};
// 로그라이크 그림을 같은 사이트에서 불러 쓴다. 사이트: /gunrim/munpa/ → /gunrim/img/, 내 컴퓨터: 로그라이크 폴더
const RL_LOCAL=location.protocol==='file:';
const rlImg=n=>RL_LOCAL?`../../군림천하_로그라이크/img/${n}.png`:`../img/${n}.webp`;
const LOCAL_FX={wolnyeo:1,nakroe:1,nanhwa:1,yeomhwa:1,guban:1};const fxUrl=n=>LOCAL_FX[n]?`img/fx/${n}_sheet.${RL_LOCAL?'png':'webp'}`:rlFx(n);
const rlFx=n=>RL_LOCAL?`../../군림천하_로그라이크/img/fx/${n}_sheet.png`:`../img/fx/${n}_sheet.webp`;
// 일기토 초식: 무공마다 [강공, 쾌검, 수비] = [초식 이름, 이펙트]. 이펙트 이름은 로그라이크 img/fx와 같다(배포 때 검사)
const MOVES={
  yuun:[['유운검봉','geombong'],['운중암전','amjeon'],['유운출곡','chulgok']],
  yuungyeol:[['유운단악','danak'],['운해승기','seunggi'],['운무중첩','unmu']],
  cheonha:[['천하성산','seongsan'],['천하밀밀','milmil'],['천하수조','suzo']],
  nakha:[['반천흥염','bancheon'],['채흥서천','nakha'],['천강은홍','cheongang']],
  punghan:[['풍한참','suzo'],['풍한연환','seongjin'],['풍한회선','milmil']],pungroe:[['풍뢰벽','danbong'],['풍뢰질주','jetan'],['풍뢰회도','geumgang']],geombo:[['검보 직자','danak'],['검보 연자','unmu'],['검보 봉자','chulgok']],
  janggwae:[['천전만권','cheonjeon'],['조운육환','jounyuk'],['단봉조양','danbong']],
  hongdan:[['홍단서천','hongdan'],['홍단서천','hongdan'],['홍단서천','hongdan']],
  yakryu:[['약류장','yakryu'],['약류장','yakryu'],['약류장','yakryu']],
  muyeom:[['무염십팔보','muyeom'],['무염십팔보','muyeom'],['무염십팔보','muyeom']],
  nanhwa:[['난화지','nanhwa'],['난화지','nanhwa'],['난화지','nanhwa']],
  yeomhwa:[['염화옥수','yeomhwa'],['염화옥수','yeomhwa'],['염화옥수','yeomhwa']],
  guban:[['서우망월','guban'],['낭아선륜','guban'],['마면배심','guban']],

/* ================= 수련 ================= */
const costOf=lv=>lv<3?1:lv<6?2:lv<9?3:4;
// 관문: 6성과 10성. 임영옥의 칠음진기 6성 관문은 강일비가 열어 준다
function gateOf(d,a){const lv=d.arts[a];if(a==='chileum'&&d.taeum&&has('ilbi'))return 0;if(lv===5)return 1;if(lv===9)return 2;return 0}
function gainWis(d,n,why){d.wis=(d.wis||0)+n;log(`${d.n}이(가) ${why}에서 깨달음 ${n}을(를) 얻었다. (가진 깨달음 ${d.wis})`)}
function capOf(d,a){if(a==='chileum')return d.taeum?10:2;if(d.capUp&&d.capUp[a])return 10;return ARTS[a].cap}
function power(d){const ms=[],ss=[];for(const a in d.arts){if(ARTS[a].t==='b')continue;(ARTS[a].t==='m'?ms:ss).push(d.arts[a])}ms.sort((a,b)=>b-a);ss.sort((a,b)=>b-a);
  let p=(ms[0]||0)*10+(ms[1]||0)*3+(ss[0]||0)*5+(d.mukryeong?10:0)+(d.arts.muyeom?d.arts.muyeom*8:0);if(d.id==='jin'){if(G.flags.yongyeong)p+=15;if(G.flags.geomjeong)p+=20;if(G.p2)p+=15*G.p2.relic;if(d.capUp&&d.capUp.cheonha)p+=5}return p}
// 수련 방향이 없으면 올릴 수 있는 것 중 가장 높은 무공(한 우물)
const FEMALE={lim:1,bang:1,seomun:1};
const fitOf=(d,a)=>{const A=ARTS[a];if(A.t==='s')return d.st.oseong;if(A.t==='b')return 60;const w=A.w==='sin'?(d.st.geom+d.st.gwon)/2:(d.st[A.w]||60);return w+(FEMALE[d.id]&&a==='wolnyeo'?25:0)};
function pickFocus(d,t){
  const cur=t==='m'?d.focusM:d.focusS;
  if(cur&&d.arts[cur]!=null&&d.arts[cur]<capOf(d,cur))return cur;
  let best=null;for(const a in d.arts){if(ARTS[a].t!==t||d.arts[a]>=capOf(d,a))continue;if(gateOf(d,a)&&(d.wis||0)<gateOf(d,a)&&(d.xp[a]||0)>=costOf(d.arts[a]))continue;const sc=x=>t==='m'?fitOf(d,x)+d.arts[x]*4:d.arts[x];if(!best||sc(a)>sc(best))best=a}
  return best;
}
function gain(d){
  const half=d.teachHalf?.5:1;d.teachHalf=false;
  if(d.id==='jin')return (G.jinSec?secMul():G.retreat?3*(G.flags.yeongong?1.3:1)*(G.flags.sulyeon?1.2:1):G.jinBusy?0:G.jinFocus?2:1)*(1+.1*G.fac.yeon)*half;
  if(d.coach){d.coach=false;return {train:1,guard:.35,study:.2,shop:.2,seclude:secMul(),rest:0,away:.2,hurt:0}[d.pos]*(1+.1*G.fac.yeon)*half*2}
  const base={train:1,guard:.35,study:.2,shop:.2,seclude:secMul(),rest:0,away:.2,hurt:0}[d.pos]||0;
  return base*(1+.1*G.fac.yeon)*half;
}
function monthPct(d,a){let g;if(d.id==='jin')g=(G.jinSec?secMul():G.retreat?3:G.jinBusy?0:G.jinFocus?2:1)*(1+.1*G.fac.yeon);else g=({train:1,guard:.35,study:.2,shop:.2,seclude:secMul(),rest:0,away:.2,hurt:0}[d.pos]||0)*(1+.1*G.fac.yeon)*(d.coach?2:1);
  return Math.round(100*g*growOf(d,a)*(a==='chileum'&&d.taeum?1.2:1)/costOf(d.arts[a]))}
function train(d){
  if(d.cold){d.cold=0;return}
  const g=gain(d)/2;if(!g)return;
  // 돈오: 수련에 든 순(진산월은 전념·폐관)에 오성에 따라 2~4%로 수련 중인 무공이 한 단계 오른다(관문도 넘는다)
  if((d.id==='jin'?(G.jinFocus||G.retreat):d.pos==='train')&&Math.random()<.025*d.st.oseong/80){const t=Math.random()<.5?'m':'s',a=pickFocus(d,t)||pickFocus(d,t==='m'?'s':'m');
    if(a&&d.arts[a]<capOf(d,a)){const big=gateOf(d,a)>0;d.arts[a]++;d.xp[a]=0;log(big?`<b>${d.n}이(가) ${ARTS[a].n}에 대해 크게 깨달았다.</b> (${d.arts[a]}성)`:`${d.n}의 ${ARTS[a].n}에 대한 조예가 깊어졌다. (${d.arts[a]}성)`)}}
  if(d.pos==='train'||d.pos==='seclude'||(d.id==='jin'&&(G.jinFocus||G.retreat||G.jinSec))){const stuck=Object.keys(d.arts).some(a=>gateOf(d,a)&&(d.wis||0)<gateOf(d,a)&&(d.xp[a]||0)>=costOf(d.arts[a]));
    if(Math.random()<(stuck?.06:.012)*d.st.oseong/80*(G.flags.yeongong?1.4:1)*(G.flags.sulyeon?1.2:1)*(d.pos==='seclude'||(d.id==='jin'&&G.jinSec)?2:1))gainWis(d,1,stuck?'벽 앞에서 버틴 수련':'수련')}
  for(const t of['m','s']){
    const a=pickFocus(d,t);if(!a)continue;
    d.xp[a]=(d.xp[a]||0)+g*growOf(d,a)*(a==='chileum'&&d.taeum?1.2:1);
    while(d.arts[a]<capOf(d,a)&&d.xp[a]>=costOf(d.arts[a])){const need=gateOf(d,a);if(need&&(d.wis||0)<need){if(!d.gateSaid)log(`${d.n}의 ${ARTS[a].n}이(가) ${d.arts[a]}성에서 막혔다. 깨달음 ${need}이(가) 필요하다.`);d.gateSaid=1;d.xp[a]=Math.min(d.xp[a],costOf(d.arts[a]));break}
      if(need){d.wis-=need;d.gateSaid=0;log(`${d.n}이(가) 깨달음을 얻어 ${ARTS[a].n}의 벽을 넘었다.`)}
      d.xp[a]-=costOf(d.arts[a]);d.arts[a]++;
      log(`${d.n}의 ${ARTS[a].n}이(가) ${d.arts[a]}성에 올랐다.`)}
    if(d.arts[a]>=capOf(d,a))d.xp[a]=0;
  }
}

// 태을선거: 진산월이 직접 간다(한 달을 다 쓴다). 열석대진은 천하삼십육검 6성 이상이어야 뚫는다

  if(j.arts.yuun!=null){j.arts.yuungyeol=j.arts.yuun;j.xp.yuungyeol=j.xp.yuun||0;delete j.arts.yuun;delete j.xp.yuun;if(j.focusM==='yuun')j.focusM='yuungyeol'}j.arts.yuungyeol=Math.min(10,(j.arts.yuungyeol||0)+2);j.xp.yuungyeol=0;
  const gj=(j.arts.yuungyeol||0)>=7;if(gj)G.flags.geomjeong=1;

function suggest(){
  const used=new Set(),pick={};
  const pool=()=>{const c=freeDs().filter(d=>!used.has(d.id)&&d.id!=='lim'&&d.pos!=='study'&&d.pos!=='shop');const calm=c.filter(d=>d.mind<70);return calm.length?calm:c};
  const sv=(d,k)=>!k||k==='mu'?power(d):d.st[k];
  const best=(need,k)=>{const c=pool();const ok=c.filter(d=>chanceK(d,need,k)>=60).sort((a,b)=>sv(a,k)-sv(b,k));return ok[0]||c.sort((a,b)=>sv(b,k)-sv(a,k))[0]};
  // 위기 먼저(놓치면 손해가 크다), 그다음 보수 큰 의뢰부터
  for(const e of G.q.filter(x=>x.t==='crisis')){const o=e.opts.slice().sort((a,b)=>a.need-b.need)[0];const d=best(o.need);if(d){used.add(d.id);pick[e.id]={d:d.id,o:o.k}}}
  for(const e of G.q.filter(x=>x.t==='job').sort((a,b)=>(b.pay||0)-(a.pay||0))){const d=best(e.need,e.k);if(d){used.add(d.id);pick[e.id]={d:d.id}}}
  return pick;
}

<p>은자 ${G.eun} · 명성 ${G.fame} · 호감 ${G.fav} · 구파 자격 ${G.qual} · 제자 ${G.ds.length}명</p>${!G.part&&!G.over&&G.ending&&G.ending.n!=='몰락'?'<button class="main" onclick="A.part2()" style="margin-right:8px">2부 「서장전」 시작</button>':''}<button ${G.part||G.over||!G.ending||G.ending.n==='몰락'?'class="main"':''} onclick="A.restart()">처음부터</button></div><div class="panel"><div class="log">${G.log.join('<br>')}</div></div></div>`;return}
  const qn=G.q.length;
  app.innerHTML=topBar()+`<div class="wrap"><div class="tabs">${[['main','본산'],['map','지도'],['disc','제자'],['dev','개발'],['ev',`사건${qn?` (${qn})`:''}`],['cal','일정']].map(([k,n])=>`<button class="${TAB===k?'on':''}" onclick="A.tab('${k}')">${n}</button>`).join('')}
<button style="margin-left:auto" onclick="A.restart()">새로</button></div>
${{main:mainTab,map:mapTab,disc:discTab,dev:devTab,ev:()=>evTab(),cal:calTab}[TAB]()}</div>
<button class="main next" onclick="A.next()" ${MODAL||DUEL?'disabled':''}>${G.half===0?'하순으로 ▶':'다음 달 ▶'}</button>`+modalHTML()+duelHTML();
  if(typeof requestAnimationFrame!=='undefined')requestAnimationFrame(playFx);
  if(TAB==='main')initYard();
}
/* ================= 시작 ================= */
// 관전 모드(?bot=1): 봇이 한 달씩 두는 것을 보여 준다. 저장은 하지 않는다
const BOT=/[?&]bot=1/.test(location.search);
function botMonth(){
  if(MODAL){A.choose(Math.floor(Math.random()*MODAL.ch.length));return}
  if(G.over||G.done)return;
  const fr=freeDs(),say=[];
  if(G.task){const s=fr.filter(d=>d.id!=="lim").sort((a,b)=>b.st.ji-a.st.ji)[0];if(s&&s.pos!=="study"){A.pos(s.id,"study");say.push(s.n+" → 장경각 해독")}}
  fr.filter(d=>d.pos!=="study"&&d.mind>=70).forEach(d=>{A.pos(d.id,"rest");say.push(d.n+" → 휴식(심마)")});
  fr.filter(d=>d.pos==="rest"&&d.mind<20).forEach(d=>A.pos(d.id,"train"));
  const n0=G.q.length;A.auto();if(G.q.length<n0)say.push("추천대로 파견 "+(n0-G.q.length)+"건");
  for(const e of [...G.q]){
    if(false){const d=freeDs().filter(d=>d.id!=="lim").sort((a,b)=>power(b)-power(a))[0];if(d){document.getElementById("cs_"+e.id).value=d.id;A.defend(e.id,"sang");say.push(d.n+" → 서안 상권 방어")}}
    else if(e.t==="job"&&G.act>0){const d=freeDs().filter(d=>d.id!=="lim"&&d.mind<60).sort((a,b)=>power(b)-power(a))[0];if(d&&chance(d,e.need)>=50){document.getElementById("js_"+e.id).value=d.id;A.sendJob(e.id);say.push(d.n+" → "+e.title)}}
    else if(e.t!=="job"&&e.t!=="crisis"&&e.t!=="quest"&&e.t!=="match")A.info(e.id);
  }
  {const lc=G.q.find(e=>e.id==='limcold');if(lc)A.quest('limcold')}
  {const fq=G.q.find(e=>e.id==='findilbi');if(fq){const d=freeDs().filter(d=>d.id!=='lim').sort((a,b)=>b.st.ma-a.st.ma)[0];if(d){document.getElementById('fi_findilbi').value=d.id;A.findIlbi('findilbi');say.push(d.n+' → 삿갓 쓴 사내 찾기')}}}
  {const gq=G.q.find(e=>e.id==='gorge'),nk=D('nak');if(gq&&nk&&nk.pos!=='away'&&nk.pos!=='hurt'){document.getElementById('gs_gorge').value='nak';A.gorge('gorge');say.push('낙일방 → 협곡 정찰')}}
  for(const mq of G.q.filter(e=>e.t==='match')){const sg=matchSuggest(mq);if(sg.length<mq.opp.length)continue;sg.forEach((v,i)=>document.getElementById(`mt_${mq.id}_${i}`).value=v);A.match(mq.id);let gd=0;while(DUEL&&gd++<10){duelAuto();A.duelNext()}while(MODAL)A.choose(0);say.push(mq.title)}
  {const hq=G.q.find(e=>e.lanes||e.id==='hyeolsa'||e.id==='hyeolsa2');if(hq){const p=battleSuggest(hq);for(let l=0;l<3;l++)for(let i=0;i<2;i++)document.getElementById(`bl_${l}_${i}`).value=p[l][i]||'';A.battle(hq.id);let gd=0;while(DUEL&&gd++<10){duelAuto();A.duelNext()}say.push('종남혈사')}}
  for(const ap of G.q.filter(e=>e.t==='appl')){const s=ap.st;if(dsCount()<capOfDs()&&(s.geom+s.gwon+s.oseong)/3>=50)A.accept(ap.id)}
  if(G.act>0){G.dev=G.dev||[];const x=DEV.slice().sort((a,b)=>(dsCount()>=capOfDs()-1&&a.id.startsWith('sukso')?-1:0)-(dsCount()>=capOfDs()-1&&b.id.startsWith('sukso')?-1:0)).find(x=>!(G.devDone||[]).includes(x.id)&&!G.dev.some(v=>v.id===x.id)&&(!x.req||x.req())&&G.eun>=x.c+60&&G.dev.length<2);if(x){A.dev(x.id);say.push('개발: '+x.n)}}
  if(G.act>0&&G.fac.oe===0&&G.eun>=80&&G.m<2){A.build("oe");say.push("외당 짓기")}
  else if(G.act>0&&G.eun>=260&&G.fac.yeon<3){A.build("yeon");say.push("연무장 올리기")}
  {const j=D('jin');for(const a of ['cheondan']){if(j.arts[a]==null&&teacher(a,'jin')&&G.act>0){document.getElementById('tc_jin').value=a;A.teach('jin');say.push('진산월 '+ARTS[a].n+' 배움')}}
   const lack=Object.keys(YUK).filter(a=>j.arts[a]!=null&&j.arts[a]<YUK[a]);if(lack.length&&G.m>=20)j.focusS=lack[0]}
  for(let k=0;k<1&&G.act>0;k++){const r=recs()[k]||recs()[0];const n0=G.act;
    if(r[0]==='sortie'){const h=G.q.find(e=>e.t==='crisis');if(h)document.getElementById('jin_sortie').value=h.id}
    if(r[0]==='meet'){const t=G.ds.filter(d=>d.id!=='jin').sort((a,b)=>b.mind-a.mind)[0];document.getElementById('jin_meet').value=t.id}
    if(r[0]==='meetak'){document.getElementById('jin_meet').value='ak';A.meet()}else if(r[0]==='limfocus'){D('lim').focusS='chileum';A.focus()}else if(r[0]==='tq'){if((D('jin').arts.cheonha||0)>=5&&G.half===0&&G.act===1)A.quest('taeeul');else A.focus()}else if(r[0]==='sq'){freeDs().filter(d=>d.id!=='lim').sort((a,b)=>power(b)-power(a)).slice(0,3).forEach(d=>A.pos(d.id,'guard'));A.quest('seokshil')}else if(A[r[0]])A[r[0]]();else A.focus();if(G.act<n0)say.push(r[1].split('. ').pop());else if(G.act>0&&!G.jinFocus&&!G.jinBusy){A.focus();say.push('수련 전념')}else break}
  log("<span style=\"color:var(--blue)\">[봇] "+(say.join(", ")||"할 일 없음")+"</span>");
  A.next();
}
// 초상 점검(?gallery=1): 게임에 나오는 인물과 일기토 상대의 그림이 어디서 오는지 한눈에
if(/[?&]gallery=1/.test(location.search)){const rows=[];
  const add=(grp,n,src,note)=>rows.push(`<div class="d" style="text-align:center"><div class="pt" style="width:96px;height:96px;margin:0 auto;font-size:36px">${src?`<img src="${src}" alt="" onerror="this.parentNode.innerHTML='✕'">`:n[0]}</div><b>${n}</b><br><span class="muted" style="font-size:11px">${grp} · ${src?src.split('/').pop():'그림 없음(이름 첫 글자)'}${note?'<br>'+note:''}</span></div>`);
  for(const r of ROSTER)add('종남',r.n,r.rl?rlImg(r.rl):r.img,r.rl?'로그라이크 연동':'');
  add('종남','강일비(숨긴 모습)','img/ilbi_hat.webp','');add('종남','강일비','img/ilbi.webp','');add('종남','전풍개','img/jeonp.webp','');add('종남','전흠','img/jeonh.webp','');add('종남','악자화','img/ak.webp','');add('종남','동중산','img/dong.webp','');add('종남','노해광','img/nohae.webp','');add('종남','하동원','img/hadong.webp','');add('종남','성락중','img/seongrak.webp','');add('종남','서문연상','img/seomun.webp','');add('종남','단리상','img/danri.webp','');add('종남','유소응','img/yuso.webp','');[['손풍',24]].forEach(([n,k])=>add('종남(합류)',n,null,`그림요청 ${k}번`));
  for(const L of LANES)add('종남혈사 장수',L.boss.n,enemyImg(L.boss.n),enemyImg(L.boss.n)?'':'그림요청 14~15번');
  for(const n in RLEN)add('로그라이크 적',n,rlImg(RLEN[n][0]),RLEN[n][1]?RLEN[n][1].join('·'):'');
  document.getElementById('app').innerHTML=`<div class="wrap"><h2>초상 점검</h2><p class="muted">✕는 파일이 있어야 하는데 안 열린 것, 글자는 아직 그림이 없는 것이다.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${rows.join('')}</div></div>`}
else if(BOT){save=()=>{};newGame();TAB="main";setInterval(botMonth,1500)}
else if(load()){boMigrate();if(G.ds.some(d=>d.id==='nohae')){G.devDone=G.devDone||[];if(!G.devDone.includes('ju')){G.devDone.push('ju');G.income.ju=25;G.dev=(G.dev||[]).filter(v=>v.id!=='ju')}}{const ib=G.ds.find(d=>d.id==='ilbi');if(ib&&!ib.reArm){ib.reArm=1;ib.st.geom=70;ib.st.gwon=95;Object.assign(ib.arts,{yuun:2,cheonha:2,nanhwa:Math.max(8,ib.arts.nanhwa||0),yeomhwa:Math.max(8,ib.arts.yeomhwa||0)});if(ib.focusM==='yuun'||ib.focusM==='cheonha')ib.focusM=null}}{const nh=G.ds.find(d=>d.id==='nohae');if(nh){delete nh.elder;Object.assign(nh.st,{tong:60,geom:85,gwon:80,oseong:65});for(const [k,v] of [['cheonha',7],['yuun',6],['taeeul',6]])if((nh.arts[k]||0)<v){nh.arts[k]=v;nh.xp[k]=0}}}for(const d of G.ds){if(!d.taeum&&d.arts.chileum>2){d.arts.chileum=2;d.xp.chileum=0}if(!d.taeum&&d.focusS==='chileum'&&(d.arts.chileum||0)>=2)d.focusS=null}const RN={jeonp:'사숙조(원로)',jeonh:'사숙(전풍개의 아들)',seongrak:'사숙',hadong:'사숙',dong:'진산월의 제자',danri:'진산월의 제자',sonp:'진산월의 제자',seomun:'빈객(검보)',nohae:'파문된 사숙'};for(const d of G.ds){if(RN[d.id])d.r=RN[d.id];if(d.id==='nohae')d.img='img/nohae.webp';if(d.id==='hadong')d.img='img/hadong.webp';if(d.id==='sonp')d.img='img/sonp.webp';if(d.id==='seongrak')d.img='img/seongrak.webp';if(d.id==='seomun')d.img='img/seomun.webp';if(d.id==='danri')d.img='img/danri.webp';if(d.id==='yuso')d.img='img/yuso.webp';if(d.id==='ak')d.img='img/ak.webp';if(d.id==='dong')d.img='img/dong.webp';if(d.id==='lim')d.img='img/lim.webp';if(d.id==='mae')d.img='img/mae.webp';if(d.id==='so')d.img='img/so.webp';if(d.id==='eung')d.img='img/eung.webp';if(d.id==='jeong')d.img='img/jeong.webp';if(d.id==='bang')d.img='img/bang.webp';if(d.id==='jeonp')d.img='img/jeonp.webp';if(d.id==='jeonh')d.img='img/jeonh.webp';if(d.id==='ilbi')d.img=d.n==='강일비'?'img/ilbi.webp':'img/ilbi_hat.webp';if(d.id==='nak')d.img=d.mukryeong?'img/nak2.webp':'img/nak.webp';if(d.id==='ilbi'){d.arts.muyeom=d.arts.muyeom||8;d.arts.nanhwa=d.arts.nanhwa||7;d.arts.yeomhwa=d.arts.yeomhwa||6}if(d.id==='jin'){d.rl='player';delete d.img;if(d.arts.nakha==null){d.arts.nakha=5;d.xp.nakha=0}if(d.arts.yakryu==null){d.arts.yakryu=3;d.xp.yakryu=0}}if(d.id==='du'){delete d.rl;d.img='img/du.webp'}}for(const d of G.ds){if(d.st&&d.st.mugol!=null&&d.st.geom==null){const r=ROSTER.find(x=>x.id===d.id);d.st=r?{...r.st}:{...d.st,geom:d.st.mugol,gwon:d.st.mugol}}}for(const d of G.ds)if(!d.st){const r=ROSTER.find(x=>x.id===d.id);d.st=r?{...r.st}:{tong:50,ji:50,jeong:50,ma:50,geom:60,gwon:60,oseong:60}}if(G.ilbi==='early')addIlbi(false);if(G.half==null){G.half=0;G.act=Math.min(G.act,1)}if(!G.ilbi)MODAL=prologue();if(G.flags.seongsim&&!G.flags.taeeul&&!G.q.some(e=>e.id==='taeeul'))openTaeeul();TITLE=G.done||G.over?null:{save:true};render()}else{TITLE={save:false};newGame()}
</script>
