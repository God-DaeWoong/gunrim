<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>군림천하 문파 경영</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231d1a16'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='%23b8862b' font-family='serif'>宗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1e9d8; --paper2:#e8dcc3; --card:#fbf6ea; --ink:#1d1a16; --ink2:#4a443b; --muted:#857a68;
  --red:#a3312a; --gold:#b8862b; --green:#3d7a5a; --blue:#2f6f9f; --line:#c9b994;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:15px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--ink2);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--ink);color:var(--paper)}
h1,h2,h3{font-family:'Nanum Myeongjo',serif;margin:.4em 0}
.serif{font-family:'Nanum Myeongjo',serif}
.muted{color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px}
.top b{color:#e7c77a}
.bar{display:inline-block;width:110px;height:8px;background:#4a443b;border-radius:4px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button.on{background:var(--ink);color:var(--paper)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.d .hd{display:flex;gap:8px;align-items:center}
.pt{width:44px;height:44px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;font-family:'Nanum Myeongjo',serif;font-weight:800;overflow:hidden;flex:none}
.pt img{width:100%;height:100%;object-fit:cover;object-position:top}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin:2px 2px 0 0}
.chip.s{border-color:var(--blue);color:var(--blue)}
.chip.m{border-color:var(--red);color:var(--red)}
.mind{height:5px;background:var(--paper2);border-radius:3px;margin-top:6px;overflow:hidden}
.mind i{display:block;height:100%;background:var(--red)}
select{font-family:inherit;font-size:13px;padding:3px}
.ev{border-left:4px solid var(--ink2)}
.ev.crisis{border-left-color:var(--red)}
.ev.job{border-left-color:var(--green)}
.ev.task{border-left-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(29,26,22,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:12px;max-width:560px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto}
.modal .box p{line-height:1.8}
.modal .ch{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .ch button{text-align:left}
.log{font-size:13px;line-height:1.7;max-height:220px;overflow:auto}
.duelrow{display:flex;align-items:center;justify-content:space-around;gap:10px;margin-top:10px}
.fx{position:absolute;width:240px;height:160px;margin-top:-30px;background-size:300% 200%;pointer-events:none;mix-blend-mode:screen;z-index:2}
.duelside{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:140px}
.duelside .pt{width:72px;height:72px;font-size:28px}
.vs{font-size:32px;color:var(--red)}
.hpb{width:130px;height:8px;background:var(--paper2);border-radius:4px;overflow:hidden}.hpb i{display:block;height:100%;background:var(--red)}
.duelside.hit .pt{animation:hit .35s}@keyframes hit{0%{transform:translateX(0);filter:none}25%{transform:translateX(-8px);filter:brightness(2) sepia(1) hue-rotate(-30deg)}50%{transform:translateX(7px)}100%{transform:translateX(0);filter:none}}
.next{position:fixed;right:16px;bottom:16px;z-index:6;font-size:16px;padding:12px 20px}
table.cal{border-collapse:collapse;font-size:13px;width:100%}
table.cal td,table.cal th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
@media (max-width:600px){.bar{width:70px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= 데이터 ================= */
// 무공: t = s(심법)/m(초식), cap = 기본 상한
const ARTS={
  yuun:{n:'유운검법',t:'m',w:'geom',cap:7}, yuungyeol:{n:'유운검결',t:'m',w:'geom',cap:10},
  cheonha:{n:'천하삼십육검',t:'m',w:'geom',cap:7}, nakha:{n:'낙하구구검',t:'m',w:'geom',cap:10},
  janggwae:{n:'장괘장권구식',t:'m',w:'gwon',cap:10}, hongdan:{n:'홍단서천',t:'m',w:'geom',cap:10},
  wolnyeo:{n:'월녀검법',t:'m',w:'geom',cap:10}, yakryu:{n:'약류장',t:'m',w:'gwon',cap:10},
  taeeul:{n:'태을신공',t:'s',cap:10}, guyang:{n:'구양신공',t:'s',cap:10},
  hyeoncheong:{n:'현청건곤강기',t:'s',cap:10}, taejin:{n:'태진강기',t:'s',cap:10}, cheondan:{n:'천단신공',t:'s',cap:10},
  muyeom:{n:'무염십팔보',t:'m',w:'sin',cap:10}, nanhwa:{n:'난화지',t:'m',w:'gwon',cap:10}, yeomhwa:{n:'염화옥수',t:'m',w:'gwon',cap:10},
  guban:{n:'구반장법',t:'m',w:'gwon',cap:10}, nakroe:{n:'낙뢰신권',t:'m',w:'gwon',cap:10}, chileum:{n:'칠음진기',t:'s',cap:2}
};
// 전수할 수 있는 초식. 가르칠 사람(5성 이상)이 있어야 하고, 천하삼십육검은 충성 70 이상만 배운다
const LIB=['yuun','cheonha','nakha','janggwae','hongdan','wolnyeo','yakryu','muyeom','nanhwa','yeomhwa'];
const SECRET={cheonha:70,muyeom:70,nanhwa:70,yeomhwa:70};
// 종남 심법 셋은 모두가 익히고 있고 성취만 다르다. 사부가 후계 후보로 키운 넷은 구양·현청이 1성
const BASE_S=['taeeul','guyang','hyeoncheong'],SENIOR=['lim','mae','so','eung'];
// 제자: apt = 수련 배율, ch = 충성
const ROSTER=[
  {id:'jin',n:'진산월',r:'장문인',rl:'player',st:{tong:85,ji:80,jeong:65,ma:80,geom:95,gwon:70,oseong:80},ch:100,arts:{yuun:6,cheonha:6,janggwae:4,hongdan:1,taeeul:3,guyang:1,hyeoncheong:1}},
  {id:'lim',n:'임영옥',r:'사매',st:{tong:55,ji:75,jeong:45,ma:85,geom:95,gwon:50,oseong:85},ch:95,taeum:1,arts:{yuun:7,wolnyeo:6,taeeul:5}},
  {id:'mae',n:'매상',r:'사제',st:{tong:60,ji:45,jeong:30,ma:40,geom:80,gwon:60,oseong:55},ch:80,arts:{cheonha:6,taeeul:5}},
  {id:'so',n:'소지산',r:'사제',st:{tong:70,ji:55,jeong:55,ma:45,geom:70,gwon:50,oseong:60},ch:90,arts:{nakha:5,taeeul:4}},
  {id:'eung',n:'응계성',r:'사제',st:{tong:50,ji:35,jeong:25,ma:40,geom:45,gwon:80,oseong:45},ch:85,arts:{janggwae:5,taeeul:4}},
  {id:'nak',n:'낙일방',r:'사제',st:{tong:45,ji:50,jeong:30,ma:65,geom:40,gwon:95,oseong:70},ch:85,arts:{janggwae:5,taeeul:3}},
  {id:'du',n:'두기춘',r:'사제',rl:'dugichun',st:{tong:40,ji:80,jeong:70,ma:70,geom:50,gwon:45,oseong:75},ch:35,arts:{yuun:5,taeeul:4}},
  {id:'jeong',n:'정해',r:'사제',st:{tong:55,ji:80,jeong:75,ma:60,geom:60,gwon:55,oseong:70},ch:80,arts:{yuun:5,taeeul:4}},
  {id:'bang',n:'방취아',r:'막내',st:{tong:30,ji:60,jeong:40,ma:80,geom:65,gwon:45,oseong:65},ch:90,arts:{wolnyeo:4,taeeul:3}}
];
// 능력치 이름. 무골은 초식, 오성은 심법이 오르는 속도(80이 보통)
const STN={tong:'통솔',ji:'지력',jeong:'정치',ma:'매력',geom:'검재',gwon:'권재',oseong:'오성'};
const growOf=(d,a)=>(ARTS[a].t==='s'?d.st.oseong:ARTS[a].w==='sin'?(d.st.geom+d.st.gwon)/2:d.st[ARTS[a].w]||60)/80;
const POS={train:'수련',guard:'수비',rest:'휴식',study:'장경각 해독',away:'파견 중',hurt:'요양'};
const FAC={yeon:{n:'연무장',d:'수련치 +10%/단계'},jang:{n:'장경각',d:'해독 속도, 전수할 수 있는 무공 수'},yak:{n:'약방',d:'심마·부상 회복'},oe:{n:'외당',d:'본산 방어, 잠입 차단, 사건을 일찍 앎'}};
// 로그라이크 그림을 같은 사이트에서 불러 쓴다. 사이트: /gunrim/munpa/ → /gunrim/img/, 내 컴퓨터: 로그라이크 폴더
const RL_LOCAL=location.protocol==='file:';
const rlImg=n=>RL_LOCAL?`../../군림천하_로그라이크/img/${n}.png`:`../img/${n}.webp`;
const rlFx=n=>RL_LOCAL?`../../군림천하_로그라이크/img/fx/${n}_sheet.png`:`../img/fx/${n}_sheet.webp`;
// 일기토 초식: 무공마다 [강공, 쾌검, 수비] = [초식 이름, 이펙트]. 이펙트 이름은 로그라이크 img/fx와 같다(배포 때 검사)
const MOVES={
  yuun:[['유운검봉','geombong'],['운중암전','amjeon'],['유운출곡','chulgok']],
  yuungyeol:[['유운단악','danak'],['운해승기','seunggi'],['운무중첩','unmu']],
  cheonha:[['천하성산','seongsan'],['천하밀밀','milmil'],['천하수조','suzo']],
  nakha:[['반천흥염','bancheon'],['채흥서천','nakha'],['천강은홍','cheongang']],
  janggwae:[['천전만권','cheonjeon'],['조운육환','jounyuk'],['단봉조양','danbong']],
  hongdan:[['홍단서천','hongdan'],['홍단서천','hongdan'],['홍단서천','hongdan']],
  yakryu:[['약류장','yakryu'],['약류장','yakryu'],['약류장','yakryu']],
  muyeom:[['무염십팔보','muyeom'],['무염십팔보','muyeom'],['무염십팔보','muyeom']],
  nanhwa:[['난화지',null],['난화지',null],['난화지',null]],
  yeomhwa:[['염화옥수',null],['염화옥수',null],['염화옥수',null]],
  guban:[['서우망월',null],['낭아선륜',null],['마면배심',null]],
  nakroe:[['뇌정만균',null],['낙뢰신권',null],['낙뢰신권',null]]};
const ENEMY_FX=['b_noesin','b_biryong','b_baekhwa','b_hyeolhwa','b_paewang','b_samji'];
const RLFX=[...new Set([...Object.values(MOVES).flat().map(x=>x[1]).filter(Boolean),...ENEMY_FX,'cheonha_mugung'])];
const SAVE='munpa-v1';

/* ================= 상태 ================= */
let G=null, TAB='main', MODAL=null;
function newGame(){
  G={m:1,half:0,act:1,eun:150,fame:5,fav:0,qual:30,broke:0,
     fac:{yeon:1,jang:1,yak:0,oe:0},
     ds:ROSTER.map(r=>{const arts={...r.arts};for(const s of BASE_S)if(arts[s]==null)arts[s]=SENIOR.includes(r.id)&&s!=='taeeul'?1:0;return{...r,arts,xp:{},pos:'train',away:0,mind:0,focusM:null,focusS:null,job:null}}),
     q:[],log:[],flags:{},ilbi:null,jinFocus:false,income:{sang:45,yak:20},task:null,done:false};
  // 진산월은 장문인이라 배치 대신 행동으로 수련한다
  G.ds[0].pos='guard';
  MODAL=prologue();
  save();render();
}
const D=id=>G.ds.find(d=>d.id===id);
const has=id=>!!D(id);
function log(t){G.log.unshift(`<b>${yr(G.m)}</b> ${t}`);G.log=G.log.slice(0,80)}
function yr(m){return `${Math.ceil(m/12)}년 ${((m-1)%12)+1}월`}
const HALF=['상순','하순'];
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);if(s){G=JSON.parse(s);return true}}catch(e){}return false}

/* ================= 수련 ================= */
const costOf=lv=>lv<3?1:lv<6?2:lv<9?3:4;
// 관문: 6성과 10성. 임영옥의 칠음진기 6성 관문은 강일비가 열어 준다
function gateOf(d,a){const lv=d.arts[a];if(lv===5)return a==='chileum'&&d.taeum?0:1;if(lv===9)return 2;return 0}
function gainWis(d,n,why){d.wis=(d.wis||0)+n;log(`${d.n}이(가) ${why}에서 깨달음 ${n}을(를) 얻었다. (가진 깨달음 ${d.wis})`)}
function capOf(d,a){if(a==='chileum')return d.taeum?10:2;if(d.capUp&&d.capUp[a])return 10;return ARTS[a].cap}
function power(d){const ms=[],ss=[];for(const a in d.arts)(ARTS[a].t==='m'?ms:ss).push(d.arts[a]);ms.sort((a,b)=>b-a);ss.sort((a,b)=>b-a);
  let p=(ms[0]||0)*10+(ms[1]||0)*3+(ss[0]||0)*5+(d.mukryeong?10:0);if(d.id==='jin'){if(G.flags.yongyeong)p+=15;if(G.flags.geomjeong)p+=20;if(d.capUp&&d.capUp.cheonha)p+=5}return p}
// 수련 방향이 없으면 올릴 수 있는 것 중 가장 높은 무공(한 우물)
function pickFocus(d,t){
  const cur=t==='m'?d.focusM:d.focusS;
  if(cur&&d.arts[cur]!=null&&d.arts[cur]<capOf(d,cur))return cur;
  // 태음신맥은 칠음진기부터(목숨이 걸려 있다)
  if(t==="s"&&d.taeum&&d.arts.chileum!=null&&d.arts.chileum<capOf(d,"chileum"))return "chileum";
  let best=null;for(const a in d.arts){if(ARTS[a].t!==t||d.arts[a]>=capOf(d,a))continue;if(gateOf(d,a)&&(d.wis||0)<gateOf(d,a)&&(d.xp[a]||0)>=costOf(d.arts[a]))continue;if(!best||d.arts[a]>d.arts[best])best=a}
  return best;
}
function gain(d){
  const half=d.teachHalf?.5:1;d.teachHalf=false;
  if(d.id==='jin')return (G.retreat?3*(G.flags.yeongong?1.3:1):G.jinBusy?0:G.jinFocus?2:1)*(1+.1*G.fac.yeon)*half;
  if(d.coach){d.coach=false;return {train:1,guard:.35,study:.2,rest:0,away:.2,hurt:0}[d.pos]*(1+.1*G.fac.yeon)*half*2}
  const base={train:1,guard:.35,study:.2,rest:0,away:.2,hurt:0}[d.pos]||0;
  return base*(1+.1*G.fac.yeon)*half;
}
function monthPct(d,a){let g;if(d.id==='jin')g=(G.retreat?3:G.jinBusy?0:G.jinFocus?2:1)*(1+.1*G.fac.yeon);else g=({train:1,guard:.35,study:.2,rest:0,away:.2,hurt:0}[d.pos]||0)*(1+.1*G.fac.yeon)*(d.coach?2:1);
  return Math.round(100*g*growOf(d,a)*(a==='chileum'&&d.taeum?1.2:1)/costOf(d.arts[a]))}
function train(d){
  if(d.cold){d.cold=0;return}
  const g=gain(d)/2;if(!g)return;
  // 돈오: 수련에 든 순(진산월은 전념·폐관)에 오성에 따라 2~4%로 수련 중인 무공이 한 단계 오른다(관문도 넘는다)
  if((d.id==='jin'?(G.jinFocus||G.retreat):d.pos==='train')&&Math.random()<.025*d.st.oseong/80){const t=Math.random()<.5?'m':'s',a=pickFocus(d,t)||pickFocus(d,t==='m'?'s':'m');
    if(a&&d.arts[a]<capOf(d,a)){const big=gateOf(d,a)>0;d.arts[a]++;d.xp[a]=0;log(big?`<b>${d.n}이(가) ${ARTS[a].n}에 대해 크게 깨달았다.</b> (${d.arts[a]}성)`:`${d.n}의 ${ARTS[a].n}에 대한 조예가 깊어졌다. (${d.arts[a]}성)`)}}
  for(const t of['m','s']){
    const a=pickFocus(d,t);if(!a)continue;
    d.xp[a]=(d.xp[a]||0)+g*growOf(d,a)*(a==='chileum'&&d.taeum?1.2:1);
    while(d.arts[a]<capOf(d,a)&&d.xp[a]>=costOf(d.arts[a])){const need=gateOf(d,a);if(need&&(d.wis||0)<need){if(!d.gateSaid)log(`${d.n}의 ${ARTS[a].n}이(가) ${d.arts[a]}성에서 막혔다. 깨달음 ${need}이(가) 필요하다.`);d.gateSaid=1;d.xp[a]=Math.min(d.xp[a],costOf(d.arts[a]));break}
      if(need){d.wis-=need;d.gateSaid=0;log(`${d.n}이(가) 깨달음을 얻어 ${ARTS[a].n}의 벽을 넘었다.`)}
      d.xp[a]-=costOf(d.arts[a]);d.arts[a]++;
      log(`${d.n}의 ${ARTS[a].n}이(가) ${d.arts[a]}성에 올랐다.`)}
    if(d.arts[a]>=capOf(d,a))d.xp[a]=0;
  }
}

/* ================= 사건 ================= */
function prologue(){return{title:'장례',art:'img/jin.png',p:[
  '태평검객 임장홍의 장례에 찾아온 사람은 열 명이 채 되지 않았다. 사부는 용문산 절벽에서 만년삼정을 손에 쥔 채 떨어졌고, 숨이 끊어지기 전에 그것과 장문인 자리를 진산월에게 맡겼다.',
  '조문객 사이에 삿갓을 깊이 눌러쓴 청삼 차림의 중년인이 있었다. 사내는 영전 앞에서 오래 절했다. 일어선 사내가 진산월을 보며 낮게 물었다.',
  '"태평검객이 목숨과 바꾼 만년삼정을, 그대는 어디에 쓸 생각인가?"'],
  ch:[
    ['사부님 뜻대로 제가 먹겠습니다.',()=>{G.ilbi='late';G.flags.samUse='jin';log('삿갓 쓴 사내은 말없이 떠났다.')}],

  lanes.forEach((ids,l)=>{const d=ids[0]&&D(ids[0]);const b=LANES[l].boss;if(d&&b)list.push({l,d:d.id,bn:b.n,bpw:Math.round(b.pw*(e.k||1))})});
  DUEL={eid,lanes,list,i:0,mods:[{o:1,e:1},{o:1,e:1},{o:1,e:1}]};nextDuel()}
function nextDuel(){const c=DUEL.list[DUEL.i];if(!c){const {eid,lanes,mods}=DUEL;DUEL=null;fight(eid,lanes,mods);return}
  const d=D(c.d);DUEL.cur={...c,hp:[100,100],r:0,msg:[`${LANES[c.l].n}. ${c.bn}이(가) 앞으로 나섰다. ${d.n}이(가) 검을 뽑았다.`],emv:pickMove(),hit:null};render()}
function pickMove(){const ks=['kang','kwae','su'];return ks[Math.floor(Math.random()*3)]}
function tellOf(c){if(c.fake==null||c.fakeR!==c.r){c.fakeR=c.r;c.fake=Math.random()<.3?['kang','kwae','su'].filter(k=>k!==c.emv)[Math.floor(Math.random()*2)]:c.emv}return TELL[c.fake][c.r%2]}

function mvName(d,mv){const a=duelArt(d),i=['kang','kwae','su'].indexOf(mv);if(!a)return MV[mv];if(a==='cheonha'&&mv==='kang'&&d.capUp&&d.capUp.cheonha)return '천하무궁';return MOVES[a][i][0]}
function mvFx(d,mv){const a=duelArt(d),i=['kang','kwae','su'].indexOf(mv);if(!a)return null;if(a==='cheonha'&&mv==='kang'&&d.capUp&&d.capUp.cheonha)return 'cheonha_mugung';return MOVES[a][i][1]}
function duelMove(mv){const c=DUEL.cur;if(!c||c.over)return;c.fx=null;const d=D(c.d),pw=power(d),bp=c.bpw,em=c.emv;c.r++;
  const dmg=(a,b)=>Math.round(22*Math.pow(a/b,.7)*(.85+Math.random()*.3));let line;
  if(mv===em){c.hp[0]-=8;c.hp[1]-=8;line=`${c.r}합: 「${mvName(d,mv)}」과 ${c.bn}의 ${MV[em]}이(가) 맞부딪쳐 서로 밀려났다.`;c.hit='both';c.fx={side:'e',n:mvFx(d,mv)}}
  else if(BEAT[mv]===em){const x=dmg(pw,bp);c.hp[1]-=x;line=`${c.r}합: ${d.n}의 「${mvName(d,mv)}」이(가) ${c.bn}의 ${MV[em]}을(를) 꺾었다. (-${x})`;c.hit='e';c.fx={side:'e',n:mvFx(d,mv)}}
  else{const x=dmg(bp,pw);c.hp[0]-=x;line=`${c.r}합: ${c.bn}의 ${MV[em]}에 ${d.n}의 「${mvName(d,mv)}」이(가) 밀렸다. (-${x})`;c.hit='p';c.fx={side:'p',n:ENEMY_FX[Math.floor(Math.random()*ENEMY_FX.length)]}}
  c.msg.push(line);c.hp=c.hp.map(v=>Math.max(0,v));
  if(c.hp[0]<=0||c.hp[1]<=0||c.r>=6){c.over=true;const win=c.hp[1]<c.hp[0]||(c.hp[1]===c.hp[0]&&pw>=bp);c.win=win;
    if(win){DUEL.mods[c.l]={o:1,e:.7,t:`${d.n} 일기토 승`};c.msg.push(`${c.bn}이(가) 무릎을 꿇었다. ${LANES[c.l].n}의 적이 흔들린다.`);gainWis(d,1,`${c.bn}와(과)의 일기토`)}
    else{DUEL.mods[c.l]={o:.85,e:1,t:`${d.n} 일기토 패`};c.msg.push(`${d.n}이(가) 물러났다. 아군의 기세가 꺾였다.`);if(d.id!=='jin'&&Math.random()<.5){d.pos='hurt';d.away=4}}}
  else c.emv=pickMove();
  render()}

// 가르칠 사람: 그 무공 5성 이상, 배우는 사람 말고. 요양·파견 중이면 못 가르친다
function teacher(a,not){return G.ds.filter(x=>x.id!==not&&x.n!=='삿갓 쓴 사내'&&(x.arts[a]||0)>=5&&x.pos!=='away'&&x.pos!=='hurt').sort((x,y)=>y.arts[a]-x.arts[a])[0]}
// 폐관 중 초가보 기습: 수비는 전력 그대로, 수련 중은 절반, 외당 단계마다 +25
function raid(){G.flags.raided=1;const def=G.ds.filter(d=>d.id!=='jin'&&!d.elder&&(d.pos==='guard'||d.pos==='train'||d.pos==='rest'||d.pos==='study')).reduce((s,d)=>s+power(d)*(d.pos==='guard'?1:.5)*(.6+d.st.tong/250),0)+25*G.fac.oe,atk=Math.round(200+5*G.m);
  if(def>=atk){G.fame+=6;G.qual+=3;log(`장문인이 없는 틈에 초가보가 본산을 쳤다. 남은 제자들이 막아 냈다. (방어 ${Math.round(def)} : 공격 ${atk}) 명성 +6`)}
  else{G.income.sang=Math.max(25,G.income.sang-10);for(const d of G.ds.filter(d=>d.pos==='guard'))if(Math.random()<.5){d.pos='hurt';d.away=4}
    log(`장문인이 없는 틈에 초가보가 본산을 쳤다. 막지 못했다. (방어 ${Math.round(def)} : 공격 ${atk}) 서안 상권 수입 -10, 수비하던 제자 일부 부상`)}}
function lose(o){G.income[o.k]=Math.max(o.k==='sang'?25:5,G.income[o.k]-(o.k==='sang'?8:5));log(`초가보에게 밀렸다: ${o.loss}`)}
function chanceK(d,need,k){if(!k||k==='mu')return chance(d,need);return Math.max(5,Math.min(95,Math.round(50+(d.st[k]-need)*1.5)))}
function chance(d,need){return Math.max(5,Math.min(95,Math.round(50+(power(d)-need)*1.2)))}

/* ================= 월말 ================= */
function endHalf(){
  if(MODAL)return;
  // 태음신맥 한기
  {const l=D('lim');if(l&&l.pos!=='away'&&l.pos!=='hurt'){const v=l.arts.chileum;const p=v==null?.35:v<4?.25:v<7?.12:0;if(Math.random()<p){l.cold=1;log(`임영옥에게 한기가 올라 이번 순은 몸을 녹이며 쉬었다.${v==null?' (칠음진기를 모른다)':` (칠음진기 ${v}성, 7성부터는 한기가 잡힌다)`}`)}}}
  // 수련(순)
  for(const d of G.ds)train(d);
  // 파견·요양 (순 단위)
  for(const d of G.ds)if(d.pos==='away'&&--d.away<=0){const j=d.job;d.pos='train';d.job=null;if(!j)continue;if(j.nak){nakReturn(d);continue}
    if(Math.random()*100<chanceK(d,j.need,j.k)){G.eun+=j.pay||0;G.fame+=j.fame||0;G.fav+=j.fav||0;let x='';if((!j.k||j.k==='mu')&&Math.random()<(j.need>=80?.4:.2)*d.st.oseong/70)gainWis(d,1,j.title);
      if(j.sp==='herb'){for(const o of G.ds)o.mind=Math.max(0,o.mind-10);x=' 약재로 제자들 심마 -10'}
      if(j.sp==='clue'&&G.task){G.task.prog=Math.min(100,G.task.prog+25);x=' 옛 기록을 찾아 성심록 해독 +25%'}
      log(`${d.n}이(가) ${j.title}을(를) 마치고 돌아왔다.${j.pay?` 은자 +${j.pay}`:''}${j.fame?` 명성 +${j.fame}`:''}${j.fav?` 호감 +${j.fav}`:''}${x}`)}
    else{d.pos='hurt';d.away=4;log(`${d.n}이(가) ${j.title}에서 다쳐 돌아왔다. 두 달 요양`)}}
    else if(d.pos==='hurt'&&--d.away<=0){d.pos='rest';log(`${d.n}이(가) 회복했다.`)}
  // 심마(순)
  for(const d of G.ds){if(d.id==='jin')continue;
    d.mind+=({train:1,guard:1.5,study:1.5,away:6,rest:-10-5*G.fac.yak,hurt:-2.5}[d.pos]||0);d.mind=Math.round(Math.max(0,Math.min(120,d.mind)));
    if(d.mind>=100&&d.pos!=='hurt'&&d.pos!=='away'){d.pos='rest';log(`${d.n}의 심마가 깊어 억지로 쉬게 했다.`)}}
  // 해독(순)
  if(G.task){const st=G.ds.filter(d=>d.pos==='study');const pr=st.reduce((s,d)=>s+10*d.st.ji/70,0)*(1+.5*(G.fac.jang-1));G.task.prog=Math.min(100,G.task.prog+pr);
    if(G.task.prog>=100){G.flags.seongsim=1;log('《성심록》 해독을 마쳤다. 매종도가 머물던 태을선거의 위치가 적혀 있다.');openTaeeul();G.task=null;for(const d of G.ds)if(d.pos==='study')d.pos='train'}}
  G.dev=G.dev||[];for(const v of G.dev)v.left--;for(const v of G.dev.filter(v=>v.left<=0))devDone(v.id);G.dev=G.dev.filter(v=>v.left>0);
  if(G.half===0){G.half=1;G.act=G.retreat||G.jinLock?0:1;G.jinLock=0;G.jinFocus=false;G.jinBusy=false;save();render();return}
  endMonth();
}
function endMonth(){
  for(const e of G.q.filter(x=>(x.id==='hyeolsa'||x.id==='hyeolsa2')&&x.due<=G.m))fight(e.id,battleSuggest());
  // 미룬 위기는 기한이 지나면 둘 다 잃는다
  for(const e of G.q.filter(x=>x.t==='crisis'&&x.due<=G.m)){for(const o of e.opts)lose(o);log('초가보의 압박을 막지 못했다.')}
  G.q=G.q.filter(x=>!(x.t==='crisis'&&x.due<=G.m)&&!(x.t==='job'&&x.due<=G.m));
  // 해독 기한
  if(G.task&&G.m>=G.task.due){log('《성심록》 해독 기한을 넘겼다. 화산이 책을 가져갔다는 소문이 돈다.');G.flags.seongsimLost=1;G.task=null;for(const d of G.ds)if(d.pos==='study')d.pos='train'}
  // 만년삼정 복용(3월)
  if(G.m===2&&!G.flags.samLost&&has('jin')){const u=G.flags.samUse;
    if(u==='lim'){G.flags.taeumSlow=1;log('만년삼정을 임영옥에게 먹였다. 태음신맥의 진행이 늦춰진다. (점검 기준 -1)')}
    else{const j=D('jin');j.arts.taeeul=Math.max(j.arts.taeeul,5);log('진산월이 만년삼정을 복용해 임독양맥을 뚫었다. 태을신공 5성')}}
  // 폐관
  if(G.retreat){G.retreat--;G.act=0;
    if(G.retreat===1)raid();
    if(G.retreat===0)endRetreat()}
  // 돈
  const up=G.ds.filter(d=>!d.elder&&d.id!=='jeonp').length*5+Object.values(G.fac).reduce((s,v)=>s+v*5,0);const inc=Object.values(G.income).reduce((s,v)=>s+v,0);
  G.eun+=inc-up;log(`월말 정산: 수입 ${inc}, 지출 ${up} → 은자 ${G.eun}`);
  if(G.eun<0){G.broke++;if(G.broke>=3){gameOver('은자가 바닥난 채 석 달이 지났다. 제자들이 하나둘 산을 내려갔다.');return}}else G.broke=0;
  // 라이벌
  G.qual=Math.max(0,G.qual-1);
  if(G.patrol)log('서안을 순찰한 덕에 이달은 화산이 상권에 손대지 못했다.');
  else if(G.m>=4&&G.income.sang>25&&Math.random()<.35){G.income.sang=Math.max(25,G.income.sang-5);log('화산이 서안 상권을 넘본다. 상권 수입 -5')}
  else if(G.m>=2)log('형산이 종남의 구파 자격을 문제 삼는다. 구파 자격 -1');
  // 임영옥 점검
  if(G.m===12||G.m===24){const l=D('lim'),need=(G.m===12?4:7)-(G.flags.taeumSlow?1:0),v=l.arts.chileum||0;
    if(v<need){l.pos='hurt';l.away=G.m===12?2:6;log(`임영옥이 ${G.m===12?'발작을 일으켰다':'위독해졌다'}. 칠음진기 ${v}성 (기준 ${need}성). 한 달 요양`)}else log(`임영옥의 칠음진기 ${v}성. 이번 해는 넘겼다. (기준 ${need}성)`)}
  if(G.m>=24){G.done=true;save();render();return}
  // 다음 달
  G.m++;G.half=0;G.act=1;G.jinFocus=false;G.jinBusy=false;G.patrol=false;
  for(const e of scheduled(G.m)){if(e.id==='seongsim'){G.task={prog:0,due:e.due}}
    if(e.resolve){const t=e.resolve();if(t)e.text=t}G.q.push(e)}
  for(let i=0;i<2;i++)if(G.q.filter(e=>e.t==='job').length<3&&Math.random()<.65){const j=job();if(j)G.q.push(j)}
  save();render();
}

<span><b>${yr(G.m)} ${HALF[G.half]}</b> (${G.m}/48)</span><span>행동 <b>${G.act}</b>/1</span><span>은자 <b>${G.eun}</b></span><span>명성 <b>${G.fame}</b></span><span>호감 <b>${G.fav}</b></span>

function suggest(){
  const used=new Set(),pick={};
  const pool=()=>{const c=freeDs().filter(d=>!used.has(d.id)&&d.id!=='lim'&&d.pos!=='study');const calm=c.filter(d=>d.mind<70);return calm.length?calm:c};
  const sv=(d,k)=>!k||k==='mu'?power(d):d.st[k];
  const best=(need,k)=>{const c=pool();const ok=c.filter(d=>chanceK(d,need,k)>=60).sort((a,b)=>sv(a,k)-sv(b,k));return ok[0]||c.sort((a,b)=>sv(b,k)-sv(a,k))[0]};
  // 위기 먼저(놓치면 손해가 크다), 그다음 보수 큰 의뢰부터
  for(const e of G.q.filter(x=>x.t==='crisis')){const o=e.opts.slice().sort((a,b)=>a.need-b.need)[0];const d=best(o.need);if(d){used.add(d.id);pick[e.id]={d:d.id,o:o.k}}}
  for(const e of G.q.filter(x=>x.t==='job').sort((a,b)=>(b.pay||0)-(a.pay||0))){const d=best(e.need,e.k);if(d){used.add(d.id);pick[e.id]={d:d.id}}}
  return pick;
}

  const qn=G.q.length;
  app.innerHTML=topBar()+`<div class="wrap"><div class="tabs">${[['main','본산'],['disc','제자'],['dev','개발'],['ev',`사건${qn?` (${qn})`:''}`],['cal','일정']].map(([k,n])=>`<button class="${TAB===k?'on':''}" onclick="A.tab('${k}')">${n}</button>`).join('')}
<button style="margin-left:auto" onclick="A.restart()">새로</button></div>
${{main:mainTab,disc:discTab,dev:devTab,ev:evTab,cal:calTab}[TAB]()}</div>
<button class="main next" onclick="A.next()" ${MODAL||DUEL?'disabled':''}>${G.half===0?'하순으로 ▶':'다음 달 ▶'}</button>`+modalHTML()+duelHTML();
  if(typeof requestAnimationFrame!=='undefined')requestAnimationFrame(playFx);
}
/* ================= 시작 ================= */
// 관전 모드(?bot=1): 봇이 한 달씩 두는 것을 보여 준다. 저장은 하지 않는다
const BOT=/[?&]bot=1/.test(location.search);
function botMonth(){
  if(MODAL){A.choose(Math.floor(Math.random()*MODAL.ch.length));return}
  if(G.over||G.done)return;
  const fr=freeDs(),say=[];
  if(G.task){const s=fr.filter(d=>d.id!=="lim").sort((a,b)=>b.st.ji-a.st.ji)[0];if(s&&s.pos!=="study"){A.pos(s.id,"study");say.push(s.n+" → 장경각 해독")}}
  fr.filter(d=>d.pos!=="study"&&d.mind>=70).forEach(d=>{A.pos(d.id,"rest");say.push(d.n+" → 휴식(심마)")});
  fr.filter(d=>d.pos==="rest"&&d.mind<20).forEach(d=>A.pos(d.id,"train"));
  const n0=G.q.length;A.auto();if(G.q.length<n0)say.push("추천대로 파견 "+(n0-G.q.length)+"건");
  for(const e of [...G.q]){
    if(false){const d=freeDs().filter(d=>d.id!=="lim").sort((a,b)=>power(b)-power(a))[0];if(d){document.getElementById("cs_"+e.id).value=d.id;A.defend(e.id,"sang");say.push(d.n+" → 서안 상권 방어")}}
    else if(e.t==="job"&&G.act>0){const d=freeDs().filter(d=>d.id!=="lim"&&d.mind<60).sort((a,b)=>power(b)-power(a))[0];if(d&&chance(d,e.need)>=50){document.getElementById("js_"+e.id).value=d.id;A.sendJob(e.id);say.push(d.n+" → "+e.title)}}
    else if(e.t!=="job"&&e.t!=="crisis"&&e.t!=="quest")A.info(e.id);
  }
  {const fq=G.q.find(e=>e.id==='findilbi');if(fq){const d=freeDs().filter(d=>d.id!=='lim').sort((a,b)=>b.st.ma-a.st.ma)[0];if(d){document.getElementById('fi_findilbi').value=d.id;A.findIlbi('findilbi');say.push(d.n+' → 삿갓 쓴 사내 찾기')}}}
  {const gq=G.q.find(e=>e.id==='gorge'),nk=D('nak');if(gq&&nk&&nk.pos!=='away'&&nk.pos!=='hurt'){document.getElementById('gs_gorge').value='nak';A.gorge('gorge');say.push('낙일방 → 협곡 정찰')}}
  {const hq=G.q.find(e=>e.id==='hyeolsa'||e.id==='hyeolsa2');if(hq){const p=battleSuggest();for(let l=0;l<3;l++)for(let i=0;i<2;i++)document.getElementById(`bl_${l}_${i}`).value=p[l][i]||'';A.battle(hq.id);let gd=0;while(DUEL&&gd++<10){duelAuto();A.duelNext()}say.push('종남혈사')}}
  if(G.act>0){G.dev=G.dev||[];const x=DEV.find(x=>!(G.devDone||[]).includes(x.id)&&!G.dev.some(v=>v.id===x.id)&&(!x.req||x.req())&&G.eun>=x.c+60&&G.dev.length<2);if(x){A.dev(x.id);say.push('개발: '+x.n)}}
  if(G.act>0&&G.fac.oe===0&&G.eun>=80&&G.m<2){A.build("oe");say.push("외당 짓기")}
  else if(G.act>0&&G.eun>=260&&G.fac.yeon<3){A.build("yeon");say.push("연무장 올리기")}
  for(let k=0;k<1&&G.act>0;k++){const r=recs()[k]||recs()[0];const n0=G.act;
    if(r[0]==='sortie'){const h=G.q.find(e=>e.t==='crisis');if(h)document.getElementById('jin_sortie').value=h.id}
    if(r[0]==='meet'){const t=G.ds.filter(d=>d.id!=='jin').sort((a,b)=>b.mind-a.mind)[0];document.getElementById('jin_meet').value=t.id}
    if(r[0]==='tq'){if((D('jin').arts.cheonha||0)>=5&&G.half===0&&G.act===1)A.quest('taeeul');else A.focus()}else if(r[0]==='sq'){freeDs().filter(d=>d.id!=='lim').sort((a,b)=>power(b)-power(a)).slice(0,3).forEach(d=>A.pos(d.id,'guard'));A.quest('seokshil')}else A[r[0]]();if(G.act<n0)say.push(r[1].split('. ').pop());else if(G.act>0&&!G.jinFocus&&!G.jinBusy){A.focus();say.push('수련 전념')}else break}
  log("<span style=\"color:var(--blue)\">[봇] "+(say.join(", ")||"할 일 없음")+"</span>");
  A.next();
}
if(BOT){save=()=>{};newGame();TAB="main";setInterval(botMonth,1500)}
else if(load()){for(const d of G.ds){if(d.id==='ilbi'){d.arts.muyeom=d.arts.muyeom||8;d.arts.nanhwa=d.arts.nanhwa||7;d.arts.yeomhwa=d.arts.yeomhwa||6}if(d.id==='jin'){d.rl='player';delete d.img}if(d.id==='du'){d.rl='dugichun';delete d.img}}for(const d of G.ds){if(d.st&&d.st.mugol!=null&&d.st.geom==null){const r=ROSTER.find(x=>x.id===d.id);d.st=r?{...r.st}:{...d.st,geom:d.st.mugol,gwon:d.st.mugol}}}for(const d of G.ds)if(!d.st){const r=ROSTER.find(x=>x.id===d.id);d.st=r?{...r.st}:{tong:50,ji:50,jeong:50,ma:50,geom:60,gwon:60,oseong:60}}if(G.ilbi==='early')addIlbi(false);if(G.half==null){G.half=0;G.act=Math.min(G.act,1)}if(!G.ilbi)MODAL=prologue();if(G.flags.seongsim&&!G.flags.taeeul&&!G.q.some(e=>e.id==='taeeul'))openTaeeul();render()}else newGame();
</script>
</body>
</html>
