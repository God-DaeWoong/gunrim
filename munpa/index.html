<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>군림천하 문파 경영</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231d1a16'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='%23b8862b' font-family='serif'>宗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1e9d8; --paper2:#e8dcc3; --card:#fbf6ea; --ink:#1d1a16; --ink2:#4a443b; --muted:#857a68;
  --red:#a3312a; --gold:#b8862b; --green:#3d7a5a; --blue:#2f6f9f; --line:#c9b994;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:15px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--ink2);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--ink);color:var(--paper)}
h1,h2,h3{font-family:'Nanum Myeongjo',serif;margin:.4em 0}
.serif{font-family:'Nanum Myeongjo',serif}
.muted{color:var(--muted)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:14px}
.top b{color:#e7c77a}
.bar{display:inline-block;width:110px;height:8px;background:#4a443b;border-radius:4px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button.on{background:var(--ink);color:var(--paper)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.d{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.d .hd{display:flex;gap:8px;align-items:center}
.pt{width:44px;height:44px;border-radius:50%;background:var(--paper2);border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;font-family:'Nanum Myeongjo',serif;font-weight:800;overflow:hidden;flex:none}
.pt img{width:100%;height:100%;object-fit:cover;object-position:top}
.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin:2px 2px 0 0}
.chip.s{border-color:var(--blue);color:var(--blue)}
.chip.m{border-color:var(--red);color:var(--red)}
.mind{height:5px;background:var(--paper2);border-radius:3px;margin-top:6px;overflow:hidden}
.mind i{display:block;height:100%;background:var(--red)}
select{font-family:inherit;font-size:13px;padding:3px}
.ev{border-left:4px solid var(--ink2)}
.ev.crisis{border-left-color:var(--red)}
.ev.job{border-left-color:var(--green)}
.ev.task{border-left-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(29,26,22,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:12px;max-width:560px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto}
.modal .box p{line-height:1.8}
.modal .ch{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.modal .ch button{text-align:left}
.log{font-size:13px;line-height:1.7;max-height:220px;overflow:auto}
.next{position:fixed;right:16px;bottom:16px;z-index:6;font-size:16px;padding:12px 20px}
table.cal{border-collapse:collapse;font-size:13px;width:100%}
table.cal td,table.cal th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
@media (max-width:600px){.bar{width:70px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= 데이터 ================= */
// 무공: t = s(심법)/m(초식), cap = 기본 상한
const ARTS={
  yuun:{n:'유운검법',t:'m',cap:7}, yuungyeol:{n:'유운검결',t:'m',cap:10},
  cheonha:{n:'천하삼십육검',t:'m',cap:7}, nakha:{n:'낙하구구검',t:'m',cap:10},
  janggwae:{n:'장괘장권구식',t:'m',cap:10}, hongdan:{n:'홍단서천',t:'m',cap:10},
  wolnyeo:{n:'월녀검법',t:'m',cap:10}, yakryu:{n:'약류장',t:'m',cap:10},
  taeeul:{n:'태을신공',t:'s',cap:10}, guyang:{n:'구양신공',t:'s',cap:10},
  hyeoncheong:{n:'현청건곤강기',t:'s',cap:10}, chileum:{n:'칠음진기',t:'s',cap:2}
};
// 전수할 수 있는 초식. 가르칠 사람(5성 이상)이 있어야 하고, 천하삼십육검은 충성 70 이상만 배운다
const LIB=['yuun','cheonha','nakha','janggwae','hongdan','wolnyeo','yakryu'];
const SECRET={cheonha:70};
// 종남 심법 셋은 모두가 익히고 있고 성취만 다르다. 사부가 후계 후보로 키운 넷은 구양·현청이 1성
const BASE_S=['taeeul','guyang','hyeoncheong'],SENIOR=['lim','mae','so','eung'];
// 제자: apt = 수련 배율, ch = 충성
const ROSTER=[
  {id:'jin',n:'진산월',r:'장문인',img:'img/jin.png',apt:1,ch:100,arts:{yuun:5,cheonha:5,janggwae:3,hongdan:1,taeeul:3,guyang:1,hyeoncheong:1}},
  {id:'lim',n:'임영옥',r:'사매',apt:1.1,ch:95,taeum:1,arts:{yuun:5,wolnyeo:3,taeeul:3}},
  {id:'mae',n:'매상',r:'사제',apt:.9,ch:80,arts:{cheonha:3,taeeul:3}},
  {id:'so',n:'소지산',r:'사제',apt:.9,ch:90,arts:{nakha:2,taeeul:2}},
  {id:'eung',n:'응계성',r:'사제',apt:.8,ch:85,arts:{janggwae:3,taeeul:2}},
  {id:'nak',n:'낙일방',r:'사제',apt:1.1,ch:85,arts:{janggwae:3,taeeul:1}},
  {id:'du',n:'두기춘',r:'사제',img:'img/du.png',apt:1,ch:35,arts:{yuun:2,taeeul:2}},
  {id:'jeong',n:'정해',r:'사제',apt:.8,ch:80,arts:{yuun:2,taeeul:2}},
  {id:'bang',n:'방취아',r:'막내',apt:.9,ch:90,arts:{wolnyeo:1,taeeul:1}}
];
const POS={train:'수련',guard:'수비',rest:'휴식',study:'장경각 해독',away:'파견 중',hurt:'요양'};
const FAC={yeon:{n:'연무장',d:'수련치 +10%/단계'},jang:{n:'장경각',d:'해독 속도, 전수할 수 있는 무공 수'},yak:{n:'약방',d:'심마·부상 회복'},oe:{n:'외당',d:'본산 방어, 잠입 차단, 사건을 일찍 앎'}};
const SAVE='munpa-v1';

/* ================= 상태 ================= */
let G=null, TAB='main', MODAL=null;
function newGame(){
  G={m:1,act:2,eun:150,fame:5,fav:0,qual:30,broke:0,
     fac:{yeon:1,jang:1,yak:0,oe:0},
     ds:ROSTER.map(r=>{const arts={...r.arts};for(const s of BASE_S)if(arts[s]==null)arts[s]=SENIOR.includes(r.id)&&s!=='taeeul'?1:0;return{...r,arts,xp:{},pos:'train',away:0,mind:0,focusM:null,focusS:null,job:null}}),
     q:[],log:[],flags:{},ilbi:null,jinFocus:false,income:{sang:45,yak:20},task:null,done:false};
  // 진산월은 장문인이라 배치 대신 행동으로 수련한다
  G.ds[0].pos='guard';
  MODAL=prologue();
  save();render();
}
const D=id=>G.ds.find(d=>d.id===id);
const has=id=>!!D(id);
function log(t){G.log.unshift(`<b>${yr(G.m)}</b> ${t}`);G.log=G.log.slice(0,80)}
function yr(m){return `${Math.ceil(m/12)}년 ${((m-1)%12)+1}월`}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);if(s){G=JSON.parse(s);return true}}catch(e){}return false}

/* ================= 수련 ================= */
const costOf=lv=>lv<3?1:lv<6?2:lv<9?3:4;
function capOf(d,a){if(a==='chileum')return d.taeum?10:2;return ARTS[a].cap}
function power(d){let m=0,s=0;for(const a in d.arts){const v=d.arts[a];if(ARTS[a].t==='m')m=Math.max(m,v);else s=Math.max(s,v)}return m*10+s*5}
// 수련 방향이 없으면 올릴 수 있는 것 중 가장 높은 무공(한 우물)
function pickFocus(d,t){
  const cur=t==='m'?d.focusM:d.focusS;
  if(cur&&d.arts[cur]!=null&&d.arts[cur]<capOf(d,cur))return cur;
  // 태음신맥은 칠음진기부터(목숨이 걸려 있다)
  if(t==="s"&&d.taeum&&d.arts.chileum!=null&&d.arts.chileum<capOf(d,"chileum"))return "chileum";
  let best=null;for(const a in d.arts){if(ARTS[a].t!==t||d.arts[a]>=capOf(d,a))continue;if(!best||d.arts[a]>d.arts[best])best=a}
  return best;
}
function gain(d){
  const half=d.teachHalf?.5:1;d.teachHalf=false;
  if(d.id==='jin')return (G.jinBusy?0:G.jinFocus?1.5:.5)*(1+.1*G.fac.yeon)*half;
  if(d.coach){d.coach=false;return {train:1.5,guard:.5,study:.3,rest:0,away:.3,hurt:0}[d.pos]*d.apt*(1+.1*G.fac.yeon)*half*2}
  const base={train:1.5,guard:.5,study:.3,rest:0,away:.3,hurt:0}[d.pos]||0;
  return base*d.apt*(1+.1*G.fac.yeon)*half;
}
function train(d){
  const g=gain(d);if(!g)return;
  for(const t of['m','s']){
    const a=pickFocus(d,t);if(!a)continue;
    d.xp[a]=(d.xp[a]||0)+g;
    while(d.arts[a]<capOf(d,a)&&d.xp[a]>=costOf(d.arts[a])){d.xp[a]-=costOf(d.arts[a]);d.arts[a]++;
      log(`${d.n}의 ${ARTS[a].n}이(가) ${d.arts[a]}성에 올랐다.`)}
    if(d.arts[a]>=capOf(d,a))d.xp[a]=0;
  }
}

/* ================= 사건 ================= */
function prologue(){return{title:'장례',art:'img/jin.png',p:[
  '태평검객 임장홍의 장례에 찾아온 사람은 열 명이 채 되지 않았다. 사부는 용문산 절벽에서 만년삼정을 손에 쥔 채 떨어졌고, 숨이 끊어지기 전에 그것과 장문인 자리를 진산월에게 맡겼다.',
  '조문객 사이에 삿갓을 깊이 눌러쓴 노인이 있었다. 노인은 영전 앞에서 오래 절했다. 일어선 노인이 진산월을 보며 낮게 물었다.',
  '"태평검객이 목숨과 바꾼 만년삼정을, 그대는 어디에 쓸 생각인가?"'],
  ch:[
    ['사부님 뜻대로 제가 먹겠습니다.',()=>{G.ilbi='late';G.flags.samUse='jin';log('삿갓 노인은 말없이 떠났다.')}],
    ['문파를 위해 쓰겠습니다.',()=>{G.ilbi='late';G.flags.samUse='jin';log('삿갓 노인은 말없이 떠났다.')}],
    ['사매의 몸이 요즘 이상합니다. 사매에게 쓸까 합니다.',()=>{G.ilbi='early';G.flags.samUse='lim';
      MODAL={title:'삿갓 노인',p:['노인이 임영옥의 증상을 하나하나 물었다. 손끝이 차고, 기침이 잦고, 한여름에도 얼굴이 희다는 말을 듣자 노인의 얼굴이 굳었다.','"그 영약으로는 그 병을 못 고친다. 태음신맥이다." 노인은 삿갓을 벗었다. "내 이름은 강일비다. 네 사부의 사형이지. 그 아이는 내가 맡으마. 다만 내가 돌아왔다는 것은 문 밖에 알리지 마라."'],ch:[['알겠습니다, 사백님.',()=>{addArt('lim','chileum');log('강일비가 본산에 머물며 임영옥에게 칠음진기를 가르치기 시작했다.')}]]};
      return true}]
  ]}}
function addArt(id,a){const d=D(id);if(d&&d.arts[a]==null){d.arts[a]=0;d.xp[a]=0}}
// 이달 시작에 들어오는 정해진 사건
function scheduled(m){
  const E=[];
  if(m===1)E.push({t:'event',id:'sam',title:'만년삼정',due:2,text:'만년삼정을 복용하려면 길일을 골라 몸을 다스려야 한다. 3월 초하루로 날을 잡았다. 그때까지 영약은 장문인 거처의 옥함에 있다.',info:1});
  if(m===2)E.push(theft());
  if(m===2)E.push({t:'event',id:'sign',title:'임영옥의 징조',text:'임영옥이 차를 따르다 찻잔을 떨어뜨렸다. 손끝이 얼음처럼 차다.',info:1});
  if(m===3&&G.ilbi==='late'){addArt('lim','chileum');E.push({t:'event',id:'oldman',title:'떠돌이 노인',text:'장례식 날 보았던 삿갓 노인이 본산에 찾아와 하룻밤 묵기를 청했다. 노인은 그 뒤로 떠나지 않고 후산 초막에 머문다. 이상하게도 임영옥과 자주 이야기를 나눈다.',info:1})}
  if(m===3)E.push({t:'task',id:'seongsim',title:'《성심록》 해독',due:14,text:'장경각 깊은 곳에서 3대조 장하민의 《성심록》이 나왔다. 오래된 글자라 읽어 내려면 오성 높은 제자가 장경각에 붙어 있어야 한다. 화산에서 이 책을 노린다는 소문이 있다.'});
  if(m===5||m===9)E.push(crisis(m));
  if(m===12)E.push({t:'event',id:'yearend',title:'1년이 지났다',info:1,text:'최소판은 여기까지다. 다음 판부터 태을선거, 석실 폐관, 초가보 본산 기습이 이어진다.'});
  return E;
}
function theft(){return{t:'event',id:'theft',title:'옥함',info:1,resolve:()=>{
  const du=D('du');if(!du)return'';
  if(du.ch>=60){du.ch+=10;return'두기춘이 밤늦게 장문인 거처 앞을 서성이다 돌아갔다. 무엇인가 마음을 접은 얼굴이었다.'}
  const guards=G.ds.filter(d=>d.pos==='guard'&&d.id!=='du').length;
  if(G.fac.oe>=1||guards>=3){MODAL={title:'붙잡힌 손',p:['밤중에 옥함을 열던 두기춘이 수비를 서던 사형제들에게 붙잡혔다. 두기춘은 무릎을 꿇은 채 고개를 들지 못했다.'],ch:[
    ['파문한다.',()=>{G.ds=G.ds.filter(d=>d.id!=='du');G.flags.duEnemy=1;log('두기춘을 파문했다. 그는 화산 쪽으로 갔다는 소문이 돌았다.')}],
    ['용서한다. 대신 지켜본다.',()=>{du.ch=40;du.mind=40;log('두기춘을 용서했다. 사형제들의 눈길이 곱지 않다.')}]]};return'옥함 쪽에서 소란이 일었다.'}
  G.ds=G.ds.filter(d=>d.id!=='du');G.flags.samLost=1;G.flags.duEnemy=1;
  return'아침에 옥함을 열자 비어 있었다. 두기춘도 사라졌다. 사부가 목숨과 바꾼 영약이었다.'}}}
function crisis(m){return{t:'crisis',id:'cho'+m,title:'초가보의 압박',due:m+1,text:'초가보 무사들이 두 곳에 동시에 나타났다. 한 곳만 막을 수 있다.',opts:[
  {k:'sang',n:'서안 상권',need:35,loss:'서안 상권 수입 -15'},{k:'yak',n:'약초밭',need:30,loss:'약초밭 수입 -10'}]}}
// 의뢰: [이름, 필요 전력, 은자, 명성, 호감, 달 수, 설명]. 같은 의뢰는 석 달 동안 다시 뜨지 않는다
const JOBS=[
  ['서안 표행 호위',50,30,0,0,1,'서안 표국의 짐을 호위한다.'],
  ['위남 상단 호위',60,40,0,0,1,'위남으로 가는 상단을 호위한다.'],
  ['조암령 산적 소탕',70,45,2,0,1,'조암령 고개에 산적이 들끓는다는 하소연이 들어왔다.'],
  ['서안 객잔 난동 정리',45,20,1,0,1,'술 취한 낭인들이 객잔을 부수고 있다.'],
  ['태백산 약초 채집 호위',40,15,0,0,1,'약초꾼들을 호위하고 약재를 나눠 받는다. 돌아오면 제자들 심마가 조금 가라앉는다.','herb'],
  ['화산에 서신 전달',30,0,0,4,1,'이웃 문파에 예를 갖춘 서신을 전한다.'],
  ['서안 상가 분쟁 중재',55,25,2,0,1,'두 상가가 칼부림 직전이다. 종남의 이름으로 말린다.'],
  ['낙양 원행 호위',70,90,1,0,2,'낙양까지 가는 먼 길이다. 두 달 동안 자리를 비운다.'],
  ['폐사 탐방',60,0,1,0,2,'종남산 뒤편 폐사에 옛 고수의 흔적이 있다는 소문. 장경각 해독에 도움이 될 기록이 나올지도 모른다.','clue']
];
function job(){
  G.jcool=G.jcool||{};const open=JOBS.filter(j=>!(G.jcool[j[0]]>G.m)&&!G.q.some(e=>e.title===j[0])&&(j[7]!=='clue'||G.task));
  if(!open.length)return null;const [n,need,pay,fame,fav,mon,txt,sp]=open[Math.floor(Math.random()*open.length)];G.jcool[n]=G.m+3;
  const rw=[pay&&`은자 ${pay}`,fame&&`명성 ${fame}`,fav&&`호감 ${fav}`].filter(Boolean).join(', ');
  return{t:'job',id:'j'+G.m+Math.random().toString(36).slice(2,6),title:n,need,pay,fame,fav,mon,sp,due:G.m+1,text:`${txt} 보상: ${rw||'단서'}.`}}

/* ================= 행동 ================= */
function useAct(){if(G.act<=0)return false;G.act--;return true}
const A={
  tab(t){TAB=t;render()},
  build(k){const lv=G.fac[k];if(lv>=3)return;const c=80*(lv+1);if(G.eun<c||G.act<=0)return;G.eun-=c;useAct();G.fac[k]++;log(`${FAC[k].n}을(를) ${G.fac[k]}단계로 올렸다.`);save();render()},
  focus(){if(G.jinFocus||!useAct())return;G.jinFocus=true;log('진산월이 이달 수련에 전념한다.');save();render()},
  diplo(){if(G.eun<30||!useAct())return;G.eun-=30;G.fav+=5;G.qual+=2;log('화산·소림에 서신과 예물을 보냈다. 문파 호감 +5');save();render()},
  talk(){const du=D('du');if(!du||!useAct())return;du.ch+=15;log(`두기춘과 오래 이야기를 나눴다. (충성 ${du.ch})`);save();render()},
  read(){if(!G.task||G.jinBusy||!useAct())return;G.jinBusy=true;G.task.prog=Math.min(100,G.task.prog+40);log(`진산월이 장경각에 들어앉아 《성심록》을 직접 읽었다. 해독 +40% (${Math.round(G.task.prog)}%)`);
    if(G.task.prog>=100){G.flags.seongsim=1;log('《성심록》 해독을 마쳤다. 매종도가 머물던 태을선거의 위치가 적혀 있다.');G.task=null;G.q=G.q.filter(e=>e.id!=='seongsim');for(const d of G.ds)if(d.pos==='study')d.pos='train'}save();render()},
  sortie(){const sel=document.getElementById('jin_sortie');const e=sel&&G.q.find(x=>x.id===sel.value);if(!e||G.jinBusy||!useAct())return;G.jinBusy=true;const j=D('jin');
    if(e.t==='crisis'){const o=e.opts.slice().sort((a,b)=>b.need-a.need)[0];for(const x of e.opts)if(x!==o)lose(x);
      if(Math.random()*100<chance(j,o.need)+15){G.fame+=5;log(`진산월이 직접 나서 ${o.n}을(를) 지켰다. 명성 +5`)}else{lose(o);log(`진산월이 나섰지만 ${o.n}을(를) 지키지 못했다.`)}}
    else{if(Math.random()*100<chance(j,e.need)+15){G.eun+=e.pay||0;G.fame+=(e.fame||0)+2;G.fav+=e.fav||0;log(`진산월이 직접 ${e.title}을(를) 처리했다. 은자 +${e.pay||0} 명성 +${(e.fame||0)+2}`)}else log(`진산월이 ${e.title}에서 뜻을 이루지 못했다.`)}
    G.q=G.q.filter(x=>x!==e);save();render()},
  coach(){const sel=document.getElementById('jin_coach');const d=sel&&D(sel.value);if(!d||G.jinBusy||!useAct())return;G.jinBusy=true;d.coach=true;log(`진산월이 이달 ${d.n}을(를) 직접 지도한다. (${d.n} 수련 2배)`);save();render()},
  meet(){const sel=document.getElementById('jin_meet');const d=sel&&D(sel.value);if(!d||!useAct())return;d.ch=Math.min(100,d.ch+10);d.mind=Math.max(0,d.mind-25);log(`진산월이 ${d.n}과(와) 마주 앉아 이야기했다. 충성 ${d.ch}, 심마 ${d.mind}`);save();render()},
  rumor(){if(G.eun<20||!useAct())return;G.eun-=20;const nx=[5,9].find(m=>m>G.m);
    if(G.task&&Math.random()<.5){G.task.prog=Math.min(100,G.task.prog+15);log('객잔에서 옛 종남 고수의 이야기를 주워들었다. 《성심록》 해독 +15%')}else{G.fame+=1;log(nx?`초가보가 ${yr(nx)}쯤 다시 움직인다는 소문을 들었다.`:'강호의 소문을 모았다. 명성 +1')}save();render()},
  patrol(){if(G.patrol||!useAct())return;G.patrol=true;log('이달은 진산월이 서안 상권을 돌며 순찰한다.');save();render()},
  recruit(){if(G.eun<60||G.fame<15||!useAct())return;G.eun-=60;const sur='왕,유,하,장,조,한,서,오'.split(','),giv='진,명,호,성,연,우,평,기'.split(',');
    const n=sur[Math.floor(Math.random()*8)]+giv[Math.floor(Math.random()*8)]+giv[Math.floor(Math.random()*8)];const apt=+(.6+Math.min(.5,G.fame/100)+Math.random()*.2).toFixed(2);
    G.ds.push({id:'r'+G.m+Math.random().toString(36).slice(2,5),n,r:'새 제자',apt,ch:70,arts:{taeeul:0,guyang:0,hyeoncheong:0},xp:{},pos:'train',away:0,mind:0,focusM:null,focusS:null,job:null});
    log(`${n}을(를) 새 제자로 받았다. (자질 ${apt})`);save();render()},
  pos(id,v){const d=D(id);if(!d||d.pos==='away'||d.pos==='hurt')return;d.pos=v;save();render()},
  teach(id){const sel=document.getElementById('tc_'+id);const a=sel&&sel.value,d=D(id),t=a&&teacher(a,id);if(!a||!t||(SECRET[a]&&d.ch<SECRET[a])||!useAct()){render();return}
    d.arts[a]=1;d.xp[a]=0;d.focusM=a;t.teachHalf=true;log(`${t.n}이(가) ${d.n}에게 ${ARTS[a].n}을(를) 가르쳤다. (${t.n}은 이달 수련이 절반)`);save();render()},
  jdir(t,v){const j=D('jin');if(t==='m')j.focusM=v||null;else j.focusS=v||null;save();render()},
  dir(id,t,v){const d=D(id);if(t==='m')d.focusM=v||null;else d.focusS=v||null;save();render()},
  auto(){const p=suggest();for(const id in p){const e=G.q.find(x=>x.id===id);if(!e)continue;
    if(e.t==='crisis'){document.getElementById('cs_'+id).value=p[id].d;A.defend(id,p[id].o)}else{document.getElementById('js_'+id).value=p[id].d;A.sendJob(id)}}render()},
  sendJob(eid){const e=G.q.find(x=>x.id===eid);const sel=document.getElementById('js_'+eid);const d=sel&&D(sel.value);if(!e||!d)return;
    d.pos='away';d.away=e.mon||1;d.job={need:e.need,pay:e.pay,fame:e.fame,fav:e.fav,sp:e.sp,title:e.title};G.q=G.q.filter(x=>x!==e);log(`${d.n}을(를) ${e.title}에 보냈다. (승률 ${chance(d,e.need)}%)`);save();render()},
  defend(eid,k){const e=G.q.find(x=>x.id===eid);const sel=document.getElementById('cs_'+eid);const d=sel&&D(sel.value);if(!e||!d)return;
    const o=e.opts.find(x=>x.k===k);const win=Math.random()*100<chance(d,o.need);d.mind+=15;
    for(const x of e.opts)if(x!==o)lose(x);
    if(win){G.fame+=3;log(`${d.n}이(가) ${o.n}을(를) 지켜 냈다. 명성 +3`)}else{lose(o);log(`${d.n}이(가) ${o.n}을(를) 지키지 못했다.`)}
    G.q=G.q.filter(x=>x!==e);save();render()},
  giveup(eid){const e=G.q.find(x=>x.id===eid);if(!e)return;for(const o of e.opts)lose(o);G.q=G.q.filter(x=>x!==e);save();render()},
  decline(eid){const e=G.q.find(x=>x.id===eid);if(!e)return;G.q=G.q.filter(x=>x!==e);log(`${e.title} 의뢰를 거절했다.`);save();render()},
  info(eid){G.q=G.q.filter(x=>x.id!==eid);save();render()},
  choose(i){const c=MODAL.ch[i];MODAL=null;const keep=c[1]();if(!keep)MODAL=MODAL||null;save();render()},
  autoNext(v){G.autoNext=v;save()},
  next(){if(G.autoNext&&!MODAL)A.auto();endMonth()},
  restart(){if(confirm('처음부터 다시 할까요?')){localStorage.removeItem(SAVE);newGame()}}
};
// 가르칠 사람: 그 무공 5성 이상, 배우는 사람 말고. 요양·파견 중이면 못 가르친다
function teacher(a,not){return G.ds.filter(x=>x.id!==not&&(x.arts[a]||0)>=5&&x.pos!=='away'&&x.pos!=='hurt').sort((x,y)=>y.arts[a]-x.arts[a])[0]}
function lose(o){G.income[o.k]=Math.max(0,G.income[o.k]-(o.k==='sang'?15:10));log(`초가보에게 밀렸다: ${o.loss}`)}
function chance(d,need){return Math.max(5,Math.min(95,Math.round(50+(power(d)-need)*1.2)))}

/* ================= 월말 ================= */
function endMonth(){
  if(MODAL)return;
  // 미룬 위기는 기한이 지나면 둘 다 잃는다
  for(const e of G.q.filter(x=>x.t==='crisis'&&x.due<=G.m)){for(const o of e.opts)lose(o);log('초가보의 압박을 막지 못했다.')}
  G.q=G.q.filter(x=>!(x.t==='crisis'&&x.due<=G.m)&&!(x.t==='job'&&x.due<=G.m));
  // 수련
  for(const d of G.ds)train(d);
  // 파견 귀환
  for(const d of G.ds)if(d.pos==='away'&&--d.away<=0){const j=d.job;d.pos='rest';d.job=null;
    if(Math.random()*100<chance(d,j.need)){G.eun+=j.pay||0;G.fame+=j.fame||0;G.fav+=j.fav||0;let x='';
      if(j.sp==='herb'){for(const o of G.ds)o.mind=Math.max(0,o.mind-10);x=' 약재로 제자들 심마 -10'}
      if(j.sp==='clue'&&G.task){G.task.prog=Math.min(100,G.task.prog+25);x=' 옛 기록을 찾아 성심록 해독 +25%'}
      log(`${d.n}이(가) ${j.title}을(를) 마치고 돌아왔다.${j.pay?` 은자 +${j.pay}`:''}${j.fame?` 명성 +${j.fame}`:''}${j.fav?` 호감 +${j.fav}`:''}${x}`)}
    else{d.pos='hurt';d.away=2;log(`${d.n}이(가) ${j.title}에서 다쳐 돌아왔다. 두 달 요양`)}}
    else if(d.pos==='hurt'&&--d.away<=0){d.pos='rest';log(`${d.n}이(가) 회복했다.`)}
  // 심마
  for(const d of G.ds){if(d.id==='jin')continue;
    d.mind+={train:2,guard:3,study:3,away:12,rest:-20-10*G.fac.yak,hurt:-5}[d.pos]||0;d.mind=Math.max(0,Math.min(120,d.mind));
    if(d.mind>=100&&d.pos!=='hurt'&&d.pos!=='away'){d.pos='rest';log(`${d.n}의 심마가 깊어 억지로 쉬게 했다.`)}}
  // 해독 과제
  if(G.task){const st=G.ds.filter(d=>d.pos==='study');const p=st.reduce((s,d)=>s+20*d.apt,0)*(1+.5*(G.fac.jang-1));G.task.prog=Math.min(100,G.task.prog+p);
    if(G.task.prog>=100){G.flags.seongsim=1;log('《성심록》 해독을 마쳤다. 매종도가 머물던 태을선거의 위치가 적혀 있다.');G.task=null;for(const d of G.ds)if(d.pos==='study')d.pos='train'}
    else if(G.m>=G.task.due){log('《성심록》 해독 기한을 넘겼다. 화산이 책을 가져갔다는 소문이 돈다.');G.flags.seongsimLost=1;G.task=null;for(const d of G.ds)if(d.pos==='study')d.pos='train'}}
  // 만년삼정 복용(3월)
  if(G.m===2&&!G.flags.samLost&&has('jin')){const u=G.flags.samUse;
    if(u==='lim'){G.flags.taeumSlow=1;log('만년삼정을 임영옥에게 먹였다. 태음신맥의 진행이 늦춰진다. (점검 기준 -1)')}
    else{const j=D('jin');j.arts.taeeul=Math.max(j.arts.taeeul,5);log('진산월이 만년삼정을 복용해 임독양맥을 뚫었다. 태을신공 5성')}}
  // 돈
  const up=G.ds.length*5+Object.values(G.fac).reduce((s,v)=>s+v*5,0);const inc=G.income.sang+G.income.yak;
  G.eun+=inc-up;log(`월말 정산: 수입 ${inc}, 지출 ${up} → 은자 ${G.eun}`);
  if(G.eun<0){G.broke++;if(G.broke>=3){gameOver('은자가 바닥난 채 석 달이 지났다. 제자들이 하나둘 산을 내려갔다.');return}}else G.broke=0;
  // 라이벌
  G.qual=Math.max(0,G.qual-1);
  if(G.patrol)log('서안을 순찰한 덕에 이달은 화산이 상권에 손대지 못했다.');
  else if(G.m>=4&&Math.random()<.35){G.income.sang=Math.max(0,G.income.sang-5);log('화산이 서안 상권을 넘본다. 상권 수입 -5')}
  else if(G.m>=2)log('형산이 종남의 구파 자격을 문제 삼는다. 구파 자격 -1');
  // 임영옥 점검
  if(G.m===12){const l=D('lim'),need=4-(G.flags.taeumSlow?1:0),v=l.arts.chileum||0;
    if(v<need){l.pos='hurt';l.away=1;log(`임영옥이 발작을 일으켰다. 칠음진기 ${v}성 (기준 ${need}성). 한 달 요양`)}else log(`임영옥의 칠음진기 ${v}성. 이번 해는 넘겼다. (기준 ${need}성)`)}
  if(G.m>=12){G.done=true;save();render();return}
  // 다음 달
  G.m++;G.act=2;G.jinFocus=false;G.jinBusy=false;G.patrol=false;
  for(const e of scheduled(G.m)){if(e.id==='seongsim'){G.task={prog:0,due:e.due}}
    if(e.resolve){const t=e.resolve();if(t)e.text=t}G.q.push(e)}
  for(let i=0;i<2;i++)if(G.q.filter(e=>e.t==='job').length<3&&Math.random()<.65){const j=job();if(j)G.q.push(j)}
  save();render();
}
function gameOver(t){G.over=t;save();render()}

function pt(d){return `<div class="pt">${d.img?`<img src="${d.img}" alt="">`:d.n[0]}</div>`}
function artChips(d){return Object.keys(d.arts).sort((a,b)=>ARTS[a].t.localeCompare(ARTS[b].t)||d.arts[b]-d.arts[a]).map(a=>{
  const cap=capOf(d,a),f=a===pickFocus(d,ARTS[a].t),pc=d.arts[a]>=cap?0:Math.floor(100*(d.xp[a]||0)/costOf(d.arts[a]));return `<span class="chip ${ARTS[a].t}" title="상한 ${cap}성">${f?'▸':''}${ARTS[a].n} ${d.arts[a]}성${d.arts[a]>=cap?'(상한)':f?` <b>${pc}%</b>`:''}</span>`}).join('')}
function taskRate(){return Math.round(G.ds.filter(d=>d.pos==='study').reduce((s,d)=>s+20*d.apt,0)*(1+.5*(G.fac.jang-1)))}
function topBar(){return `<div class="top"><span class="serif" style="font-size:17px">終南</span>
<span><b>${yr(G.m)}</b> (${G.m}/48)</span><span>행동 <b>${G.act}</b>/2</span><span>은자 <b>${G.eun}</b></span><span>명성 <b>${G.fame}</b></span><span>호감 <b>${G.fav}</b></span>
${G.task?`<span title="제자 탭에서 장경각 해독에 배치">《성심록》 <b>${Math.round(G.task.prog)}%</b> (+${taskRate()}%/월, ${yr(G.task.due)}까지)</span>`:''}<span>구파 자격 <span class="bar"><i style="width:${Math.min(100,G.qual)}%"></i></span> ${G.qual}</span></div>`}
function recs(){const r=[];
  if(G.task&&G.task.due-G.m<=3&&G.task.prog<100)r.push(['read','《성심록》 기한이 ${G.task.due-G.m}달 남았다. 직접 읽으면 +40%']);
  const hard=G.q.find(e=>e.t==='crisis'&&!suggest()[e.id]);if(hard)r.push(['sortie','막을 만한 제자가 없는 위기가 있다. 직접 출전']);
  const tired=G.ds.filter(d=>d.id!=='jin'&&d.mind>=60).sort((a,b)=>b.mind-a.mind)[0];if(tired)r.push(['meet',`${tired.n}의 심마가 ${tired.mind}이다. 면담`]);
  if(G.eun<80&&G.m>=4)r.push(['patrol','은자가 적다. 서안 순찰로 상권을 지킨다']);
  if(G.fame>=15&&G.eun>=200&&G.ds.length<12)r.push(['recruit','명성과 은자가 넉넉하다. 제자 모집']);
  if(!r.length)r.push(['focus','급한 일이 없다. 수련 전념']);return r.slice(0,2)}

<p class="muted" style="font-size:12px">직접 읽기·출전·지도를 한 달은 진산월 자신의 수련이 없다. 시설 짓기와 무공 전수도 행동을 쓴다. 제자 파견은 행동을 쓰지 않는다.</p>`})()}</div>
<div class="panel"><h3>진산월</h3><div class="hd" style="display:flex;gap:10px;align-items:center">${pt(j)}<div>${artChips(j)}</div></div>
<div style="margin-top:8px;font-size:13px">초식 <select onchange="A.jdir('m',this.value)"><option value="">자동</option>${Object.keys(j.arts).filter(a=>ARTS[a].t==='m').map(a=>`<option value="${a}" ${j.focusM===a?'selected':''}>${ARTS[a].n}</option>`).join('')}</select>
 심법 <select onchange="A.jdir('s',this.value)"><option value="">자동</option>${Object.keys(j.arts).filter(a=>ARTS[a].t==='s').map(a=>`<option value="${a}" ${j.focusS===a?'selected':''}>${ARTS[a].n}</option>`).join('')}</select></div></div>
<div class="panel"><h3>시설</h3><div class="grid">${Object.keys(FAC).map(k=>{const lv=G.fac[k],c=80*(lv+1);return `<div class="d"><b>${FAC[k].n}</b> ${lv}단계<br><span class="muted">${FAC[k].d}</span><br>
<button style="margin-top:6px" onclick="A.build('${k}')" ${lv>=3||G.eun<c||G.act<=0?'disabled':''}>${lv>=3?'최고 단계':`${lv?'올리기':'짓기'} (${c}냥)`}</button></div>`}).join('')}</div></div>
<div class="panel"><h3>수입과 지출</h3><p>서안 상권 ${G.income.sang} · 약초밭 ${G.income.yak} / 제자 유지비 ${G.ds.length*5} · 시설 유지비 ${Object.values(G.fac).reduce((s,v)=>s+v*5,0)}</p></div>
<div class="panel"><h3>기록</h3><div class="log">${G.log.join('<br>')}</div></div>`;
}
function discTab(){
  return `<p class="muted">배치는 행동을 쓰지 않는다. ▸ 표시가 지금 수련 중인 무공이다. 수련 방향을 정하지 않으면 가장 높은 무공을 알아서 올린다.</p><div class="grid">${G.ds.filter(d=>d.id!=='jin').map(d=>{
    const lock=d.pos==='away'||d.pos==='hurt';const lib=LIB.filter(a=>d.arts[a]==null).slice(0,2+G.fac.jang*2);const tOf=a=>teacher(a,d.id),okA=a=>tOf(a)&&!(SECRET[a]&&d.ch<SECRET[a]);
    const ms=Object.keys(d.arts).filter(a=>ARTS[a].t==='m'),ss=Object.keys(d.arts).filter(a=>ARTS[a].t==='s');
    return `<div class="d"><div class="hd">${pt(d)}<div><b>${d.n}</b> <span class="muted">${d.r}</span><br>전력 ${power(d)} · 충성 ${d.ch}</div></div>
<div style="margin-top:6px">${artChips(d)}</div>
<div class="mind" title="심마 ${d.mind}"><i style="width:${Math.min(100,d.mind)}%"></i></div><span class="muted" style="font-size:11px">심마 ${d.mind}</span>
<div style="margin-top:6px">${lock?`<b>${POS[d.pos]}</b> (${d.away}달 남음)`:`<select onchange="A.pos('${d.id}',this.value)">${['train','guard','rest',...(G.task?['study']:[])].map(p=>`<option value="${p}" ${d.pos===p?'selected':''}>${POS[p]}</option>`).join('')}</select>`}</div>
<div style="margin-top:6px;font-size:12px">초식 <select onchange="A.dir('${d.id}','m',this.value)"><option value="">자동</option>${ms.map(a=>`<option value="${a}" ${d.focusM===a?'selected':''}>${ARTS[a].n}</option>`).join('')}</select>
 심법 <select onchange="A.dir('${d.id}','s',this.value)"><option value="">자동</option>${ss.map(a=>`<option value="${a}" ${d.focusS===a?'selected':''}>${ARTS[a].n}</option>`).join('')}</select></div>
${lib.length?`<div style="margin-top:6px;font-size:12px"><select id="tc_${d.id}"><option value="">전수할 무공</option>${lib.map(a=>`<option value="${a}" ${okA(a)?'':'disabled'}>${ARTS[a].n}${tOf(a)?` (스승 ${tOf(a).n})`:' (가르칠 사람 없음)'}${SECRET[a]&&d.ch<SECRET[a]?' (충성 부족)':''}</option>`).join('')}</select> <button onclick="A.teach('${d.id}')" ${G.act<=0?'disabled':''}>전수</button></div>`:''}
</div>`}).join('')}</div>`;
}
function freeDs(){return G.ds.filter(d=>d.id!=='jin'&&d.pos!=='away'&&d.pos!=='hurt')}
function suggest(){
  const used=new Set(),pick={};
  const pool=()=>{const c=freeDs().filter(d=>!used.has(d.id)&&d.id!=='lim'&&d.pos!=='study');const calm=c.filter(d=>d.mind<70);return calm.length?calm:c};
  const best=need=>{const c=pool();const ok=c.filter(d=>chance(d,need)>=60).sort((a,b)=>power(a)-power(b));return ok[0]||c.sort((a,b)=>power(b)-power(a))[0]};
  // 위기 먼저(놓치면 손해가 크다), 그다음 보수 큰 의뢰부터
  for(const e of G.q.filter(x=>x.t==='crisis')){const o=e.opts.slice().sort((a,b)=>a.need-b.need)[0];const d=best(o.need);if(d){used.add(d.id);pick[e.id]={d:d.id,o:o.k}}}
  for(const e of G.q.filter(x=>x.t==='job').sort((a,b)=>(b.pay||0)-(a.pay||0))){const d=best(e.need);if(d){used.add(d.id);pick[e.id]={d:d.id}}}
  return pick;
}
function evTab(){
  const fr=freeDs(),sg=suggest();
  const opt=(need,eid)=>fr.map(d=>`<option value="${d.id}" ${sg[eid]&&sg[eid].d===d.id?'selected':''}>${d.n} (전력 ${power(d)}, 승률 ${chance(d,need)}%${d.mind>=70?', 심마':''})</option>`).join('');
  const body=G.q.map(e=>{
    if(e.t==='job')return `<div class="panel ev job"><b>${e.title}</b> <span class="muted">· ${yr(e.due)}까지</span><p>${e.text} 필요 전력 ${e.need}</p>
<select id="js_${e.id}">${opt(e.need,e.id)}</select> <button onclick="A.sendJob('${e.id}')" ${!fr.length?'disabled':''}>보내기</button> <button onclick="A.decline('${e.id}')">거절</button></div>`;
    if(e.t==='crisis')return `<div class="panel ev crisis"><b>${e.title}</b> <span class="muted">· ${yr(e.due)}까지, 미루면 둘 다 잃는다</span><p>${e.text}</p>
<select id="cs_${e.id}">${fr.map(d=>`<option value="${d.id}" ${sg[e.id]&&sg[e.id].d===d.id?'selected':''}>${d.n} (전력 ${power(d)})</option>`).join('')}</select>
${e.opts.map(o=>`<div style="margin-top:6px"><button onclick="A.defend('${e.id}','${o.k}')" ${!fr.length?'disabled':''}>${o.n} 막기 (필요 전력 ${o.need})</button> <span class="muted">못 막으면 ${o.loss}</span></div>`).join('')}<div style="margin-top:6px"><button onclick="A.giveup('${e.id}')">포기 (둘 다 잃음)</button></div></div>`;
    if(e.t==='task')return `<div class="panel ev task"><b>${e.title}</b> <span class="muted">· ${yr(e.due)}까지</span><p>${e.text}</p><p>진행 ${G.task?Math.round(G.task.prog):100}% · 이달 예상 +${G.task?Math.round(G.ds.filter(d=>d.pos==='study').reduce((s,d)=>s+20*d.apt,0)*(1+.5*(G.fac.jang-1))):0}% — 제자 화면에서 "장경각 해독"에 배치한다. 한 사람이면 다섯 달 안팎, 둘이면 석 달 안팎.</p><button onclick="A.info('${e.id}')">닫기</button></div>`;
    return `<div class="panel ev"><b>${e.title}</b><p>${e.text}</p><button onclick="A.info('${e.id}')">확인</button></div>`;
  }).join('');
  const n=Object.keys(sg).length;
  const hasWork=G.q.some(e=>e.t==='job'||e.t==='crisis');
  return (hasWork?`<div class="panel"><button class="main" onclick="A.auto()" ${n?'':'disabled'}>추천대로 한 번에 보내기 (${n}건)</button>
<label style="margin-left:10px;font-size:13px"><input type="checkbox" ${G.autoNext?'checked':''} onchange="A.autoNext(this.checked)"> 다음 달로 넘길 때 남은 일을 자동으로 보내기</label>
<div class="muted" style="font-size:12px;margin-top:4px">${n?'사건마다 한 사람씩. 임영옥과 해독 중인 사람은 빼고, 승률 60% 넘는 사람 중 가장 약한 사람, 없으면 가장 강한 사람. 승률이 낮은 건 거절해도 된다.':'보낼 사람이 없다(임영옥·해독 중·파견 중 제외).'}</div></div>`:'')+(body||'<p class="muted">이달에 들어온 일이 없다.</p>');
}
function calTab(){
  const rows=[];
  if(G.task)rows.push([yr(G.task.due),'《성심록》 해독 기한',`${Math.round(G.task.prog)}%`]);
  for(const e of G.q)if(e.due&&e.t!=='task')rows.push([yr(e.due),e.title,{job:'의뢰',crisis:'위기'}[e.t]||'']);
  if(G.m<=12){const l=D('lim');rows.push(['1년 12월','임영옥 칠음진기 점검',`지금 ${l.arts.chileum??0}성 / 기준 ${4-(G.flags.taeumSlow?1:0)}성`])}
  rows.push(['4년 12월','구파 자격 시한',`${G.qual}`]);
  return `<table class="cal"><tr><th>기한</th><th>일</th><th>상태</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;
}
function modalHTML(){if(!MODAL)return'';return `<div class="modal"><div class="box"><h2>${MODAL.title}</h2>${MODAL.p.map(x=>`<p class="serif">${x}</p>`).join('')}
<div class="ch">${MODAL.ch.map((c,i)=>`<button onclick="A.choose(${i})">${c[0]}</button>`).join('')}</div></div></div>`}
function render(){
  const app=document.getElementById('app');
  if(G.over||G.done){app.innerHTML=topBar()+`<div class="wrap"><div class="panel"><h2>${G.over?'몰락':'1년 차 끝'}</h2><p>${G.over||'최소판은 1년 차까지다. 아래 기록으로 한 해를 돌아본다.'}</p>
<p>은자 ${G.eun} · 명성 ${G.fame} · 호감 ${G.fav} · 구파 자격 ${G.qual} · 제자 ${G.ds.length}명</p><button class="main" onclick="A.restart()">처음부터</button></div><div class="panel"><div class="log">${G.log.join('<br>')}</div></div></div>`;return}
  const qn=G.q.length;
  app.innerHTML=topBar()+`<div class="wrap"><div class="tabs">${[['main','본산'],['disc','제자'],['ev',`사건${qn?` (${qn})`:''}`],['cal','일정']].map(([k,n])=>`<button class="${TAB===k?'on':''}" onclick="A.tab('${k}')">${n}</button>`).join('')}
<button style="margin-left:auto" onclick="A.restart()">새로</button></div>
${{main:mainTab,disc:discTab,ev:evTab,cal:calTab}[TAB]()}</div>
<button class="main next" onclick="A.next()" ${MODAL?'disabled':''}>다음 달 ▶</button>`+modalHTML();
}
/* ================= 시작 ================= */
// 관전 모드(?bot=1): 봇이 한 달씩 두는 것을 보여 준다. 저장은 하지 않는다
const BOT=/[?&]bot=1/.test(location.search);
function botMonth(){
  if(MODAL){A.choose(Math.floor(Math.random()*MODAL.ch.length));return}
  if(G.over||G.done)return;
  const fr=freeDs(),say=[];
  if(G.task){const s=fr.filter(d=>d.id!=="lim").sort((a,b)=>b.apt-a.apt)[0];if(s&&s.pos!=="study"){A.pos(s.id,"study");say.push(s.n+" → 장경각 해독")}}
  fr.filter(d=>d.pos!=="study"&&d.mind>=70).forEach(d=>{A.pos(d.id,"rest");say.push(d.n+" → 휴식(심마)")});
  fr.filter(d=>d.pos==="rest"&&d.mind<20).forEach(d=>A.pos(d.id,"train"));
  const n0=G.q.length;A.auto();if(G.q.length<n0)say.push("추천대로 파견 "+(n0-G.q.length)+"건");
  for(const e of [...G.q]){
    if(false){const d=freeDs().filter(d=>d.id!=="lim").sort((a,b)=>power(b)-power(a))[0];if(d){document.getElementById("cs_"+e.id).value=d.id;A.defend(e.id,"sang");say.push(d.n+" → 서안 상권 방어")}}
    else if(e.t==="job"&&G.act>0){const d=freeDs().filter(d=>d.id!=="lim"&&d.mind<60).sort((a,b)=>power(b)-power(a))[0];if(d&&chance(d,e.need)>=50){document.getElementById("js_"+e.id).value=d.id;A.sendJob(e.id);say.push(d.n+" → "+e.title)}}
    else if(e.t!=="job"&&e.t!=="crisis")A.info(e.id);
  }
  if(G.act>0&&G.fac.oe===0&&G.eun>=80&&G.m<2){A.build("oe");say.push("외당 짓기")}
  else if(G.act>0&&G.eun>=260&&G.fac.yeon<3){A.build("yeon");say.push("연무장 올리기")}
  for(let k=0;k<2&&G.act>0;k++){const r=recs()[k]||recs()[0];const n0=G.act;
    if(r[0]==='sortie'){const h=G.q.find(e=>e.t==='crisis');if(h)document.getElementById('jin_sortie').value=h.id}
    if(r[0]==='meet'){const t=G.ds.filter(d=>d.id!=='jin').sort((a,b)=>b.mind-a.mind)[0];document.getElementById('jin_meet').value=t.id}
    A[r[0]]();if(G.act<n0)say.push(r[1].split('. ').pop());else if(G.act>0&&!G.jinFocus&&!G.jinBusy){A.focus();say.push('수련 전념')}else break}
  log("<span style=\"color:var(--blue)\">[봇] "+(say.join(", ")||"할 일 없음")+"</span>");
  A.next();
}
if(BOT){save=()=>{};newGame();TAB="main";setInterval(botMonth,1500)}
else if(load()){if(!G.ilbi)MODAL=prologue();render()}else newGame();
</script>
