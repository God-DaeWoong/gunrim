<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>군림천하 로그라이크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M50 6 L58 6 L58 14 L28 44 L20 36 Z' fill='%23e8e4da' stroke='%232a2420' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M14 34 L30 50' stroke='%23b8862b' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M20 44 L10 54' stroke='%233a2418' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='56' r='4' fill='%23b8862b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1e9d8; --paper2:#e8dcc3; --ink:#1d1a16; --ink2:#4a443b; --muted:#857a68;
  --red:#a3312a; --gold:#b8862b; --green:#3d7a5a; --blue:#2f6f9f; --line:#c9b994;
  --card:#fbf6ea; --shadow:0 2px 8px rgba(40,30,10,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:15px}
body{background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.5),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(160,130,80,.15),transparent 50%);min-height:100vh}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--ink2);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px}
button:hover:not(:disabled){background:#fff}
button:disabled{opacity:.45;cursor:default}
.serif{font-family:'Nanum Myeongjo',serif}
.muted{color:var(--muted)}
#app{max-width:980px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:30;background:var(--paper);box-shadow:0 6px 10px -8px rgba(0,0,0,.25);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.top .tr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.top .tr>span{padding:4px 8px;background:var(--paper2);border-radius:5px;font-size:13px}
.hp{color:var(--red);font-weight:700}
.tbtn{padding:4px 9px;font-size:13px}
.glow{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,43,.35);font-weight:700}
h1,h2,h3{font-family:'Nanum Myeongjo',serif;margin:.4em 0}
.panel{background:rgba(251,246,234,.75);border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--paper2);border:1px solid var(--line);margin:2px}

/* title */
.title{text-align:center;padding:40px 0 10px}
.title h1{font-size:56px;letter-spacing:.15em;margin:0;font-weight:800}
.title .sub{font-family:'Nanum Myeongjo',serif;color:var(--ink2);margin-top:6px;letter-spacing:.3em}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:20px}
.diff{padding:14px;text-align:left;line-height:1.5}
.diff b{font-family:'Nanum Myeongjo',serif;font-size:18px}
.diff small{display:block;color:var(--muted)}

/* map */
.mapwrap{position:relative;margin:10px auto;max-width:560px}
.mapwrap svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;border:2px solid var(--ink2);background:var(--card);display:flex;align-items:center;justify-content:center;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:17px;padding:0}
.node small{position:absolute;top:48px;white-space:nowrap;font-size:11px;font-family:'Noto Sans KR';font-weight:500;color:var(--ink2)}
.node:disabled{opacity:1;cursor:default}
.node.done{background:var(--paper2);opacity:.55}
.node.cur{box-shadow:0 0 0 4px rgba(163,49,42,.35)}
.node.can{border-color:var(--red);animation:pulse 1.4s infinite}
.node.boss{width:62px;height:62px;background:#2a2420;color:#f1e9d8;font-size:20px}
.node.boss small{top:66px;font-weight:700;color:var(--ink)}
.node.hidden{border-style:dashed;border-color:var(--gold);color:var(--gold);background:#fff8e6}
.node.elite{color:var(--red)}
.goods{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.good{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--ink2);border-radius:9px;background:var(--card);cursor:pointer}
.good:hover{border-color:var(--gold)} .good.sel{border-color:var(--red);background:#fff6ee} .good.off{opacity:.5}
.good .gtxt{flex:1;font-size:13px} .good .gtxt span{color:var(--ink2)} .good .gbuy{text-align:right;font-weight:700;min-width:80px}
.cardsel .card{outline:3px solid var(--red);outline-offset:2px}
.ico{display:inline-flex;vertical-align:middle;border-radius:10px;background:radial-gradient(circle at 50% 40%,#3d352d,#15110e);border:1px solid var(--gold);margin-right:6px;overflow:hidden;flex:0 0 auto}
.ico img{width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box}
.node.midboss{width:54px;height:54px;border:3px solid var(--red);color:var(--red);background:#fff2ee;font-size:19px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(163,49,42,.18)}}

/* battle */
.field{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;min-height:260px}
.unit{position:relative;text-align:center;width:190px}
.unit.boss{width:220px}
.unit.sel .figbox{outline:2px dashed var(--red);outline-offset:3px;border-radius:8px}
.enemies{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;flex:1}
.figbox{position:relative;width:170px;height:255px;margin:0 auto;cursor:pointer}
.unit.boss .figbox{width:210px;height:315px}
.figbox svg,.figbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.unit.dead{opacity:.25;filter:grayscale(1)}
.unit.dead .figbox{cursor:default}
.hit .figbox{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.bar{height:8px;background:#d8ccb2;border-radius:4px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--red)}
.uname{font-family:'Nanum Myeongjo',serif;font-weight:800}
.utitle{font-size:11px;color:var(--muted)}
.stats{font-size:12px;min-height:18px}
.st{display:inline-block;padding:0 5px;margin:1px;border-radius:4px;background:var(--paper2);font-size:11px}
.st.mark{background:#2b2b55;color:#e6e6ff;font-weight:700}
.st.mark.near{background:#a3312a;color:#fff;animation:pulse 1s infinite}
.st.yin{background:#d6e8f2;color:#1f4f6f;font-weight:700}
.st.blk{background:#d6e3ea;color:#1f4f6f;font-weight:700}
.intent{font-size:13px;font-weight:700;min-height:20px;color:var(--red)}
.intent.def{color:var(--blue)} .intent.chain{font-size:12px;border:2px solid var(--red);border-radius:8px;padding:2px 6px;background:#fff2ee} .intent.buf{color:var(--gold)}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:22px;color:var(--red);pointer-events:none;animation:flt .9s forwards;text-shadow:0 0 4px #fff;white-space:nowrap;z-index:5}
.float.blue{color:var(--blue)} .float.gold{color:var(--gold)}
@keyframes flt{to{transform:translate(-50%,-50px);opacity:0}}
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:10px 0 6px}
.energy{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9c67a,#a8741f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
.endbtn{background:var(--ink);color:var(--paper);font-weight:700;padding:10px 18px}
.endbtn:hover:not(:disabled){background:#3a332c}
.log{font-size:13px;color:var(--ink2);background:rgba(232,220,195,.6);border-radius:6px;padding:6px 10px;min-height:52px;max-height:72px;overflow:hidden;line-height:1.45}
.hand{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 12px;min-height:180px}

/* card */
.card{flex:0 0 auto;position:relative;width:126px;min-height:168px;background:var(--card);border:2px solid var(--ink2);border-radius:9px;padding:24px 8px 8px;box-shadow:var(--shadow);cursor:pointer;text-align:left;transition:transform .12s}
.card:hover{transform:translateY(-6px)}
.card.off{opacity:.5}
.card .cost{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.card .cname{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:15px;line-height:1.2}
.card .cmeta{font-size:10.5px;color:var(--muted);margin:3px 0 5px}
.card .cdesc{font-size:12px;line-height:1.4}
.card .ctype{position:absolute;top:5px;right:7px;font-size:10px;color:var(--muted)}
.card.r{border-color:var(--blue)} .card.l{border-color:var(--gold);background:#fffaf0}
.card.ult{border-color:var(--gold);border-width:3px;background:linear-gradient(#fff8e6,#fbf1d6)}
.card .owned{margin-top:6px;padding:3px 5px;border-radius:4px;background:#fff1cf;color:#7a5410;font-size:11px;font-weight:700;line-height:1.3}
.card .fbar{position:absolute;left:0;right:0;top:0;height:5px;border-radius:7px 7px 0 0}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.price{text-align:center;font-weight:700;margin-top:4px}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(20,15,10,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
#modal.on{display:flex}
#modal .box{background:var(--paper);max-width:760px;width:100%;border-radius:12px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#cutin{position:fixed;left:0;right:0;top:28%;height:110px;pointer-events:none;z-index:45;display:none}
#cutin .band{position:absolute;inset:0;background:#15110d;transform-origin:left center;-webkit-mask:radial-gradient(ellipse 90% 70% at 50% 50%,#000 60%,transparent 72%);mask:radial-gradient(ellipse 90% 70% at 50% 50%,#000 60%,transparent 72%)}
#cutin .txt{position:absolute;left:0;right:0;top:8px;text-align:center;font-family:'Nanum Brush Script',cursive;font-size:72px;line-height:1;color:#f6ecd6}
#cutin .sub{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Nanum Myeongjo',serif;font-size:14px;color:#c9a35a;letter-spacing:.3em}
#toasts{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
table.arts{width:100%;border-collapse:collapse;font-size:13px}
table.arts td,table.arts th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.stars{color:var(--gold);letter-spacing:-1px}
.scroll{width:110px;height:150px;border-radius:10px;background:repeating-linear-gradient(0deg,#7a2a22 0 6px,#8e352c 6px 12px);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;color:#f6e7c1;font-family:'Nanum Myeongjo',serif;font-size:30px;font-weight:800;cursor:pointer;box-shadow:var(--shadow)}
.scroll:hover{transform:translateY(-6px)}
@media (max-height:920px) and (min-width:601px){
  .figbox{width:140px;height:210px}
  .unit.boss .figbox{width:170px;height:255px}
}
@media (max-width:600px){
  .title h1{font-size:40px}
  .unit,.unit.boss{width:46%}
  .figbox{width:110px;height:165px}
  .unit.boss .figbox{width:130px;height:195px}
  .card{width:112px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<div id="cutin"><div class="band"></div><div class="txt"></div><div class="sub"></div></div>
<script>
window.IMG_HAVE=["baekdae","baekmo","bokyang","bongwol","bukri","cheolhyeol","cheongae","danggak","dokgo","donghwi","dugichun","gamjong","gojin","gongson","gwakdang","hanchung","heemok","heomugeuk","heukgal","heukpung","hyeokryeon","jeongoe","joik","jwadong","kwaesal","maejang","maejongdo","maksong","ohaeng","oyok","padong","player","player_battle","player_bongmi","player_naengyeom","player_yeongrong","player_yeoui","player_yongyeong","pungdo","sadae","seopso","simok","sinpo","sonik","ssangrang","unjachu","wibyeong","wijirip","yayul","yujung","fx/amjeon_sheet","fx/baeun_sheet","fx/bancheon_sheet","fx/bisa_sheet","fx/bunroe_sheet","fx/b_baekhwa_sheet","fx/b_biryong_sheet","fx/b_bulgwang_sheet","fx/b_cheonji_sheet","fx/b_gujuhong_sheet","fx/b_gujupacheon_sheet","fx/b_gwiwang_sheet","fx/b_hyeolhwa_sheet","fx/b_jese_sheet","fx/b_noesin_sheet","fx/b_paewang_sheet","fx/b_samji_sheet","fx/cheongang_sheet","fx/cheonha_mugung_sheet","fx/cheonjeon_sheet","fx/chilji_sheet","fx/chulgok_sheet","fx/danak_sheet","fx/danbong_sheet","fx/dara1_sheet","fx/dara2_sheet","fx/dara3_sheet","fx/dodo_sheet","fx/eumyang_sheet","fx/eunhyeong_sheet","fx/geombong_sheet","fx/geomjeong2_sheet","fx/geomjeong_sheet","fx/geopryun_sheet","fx/geumganghangma_sheet","fx/hangryong_sheet","fx/hongdan_sheet","fx/hongye_sheet","fx/hyeolra_sheet","fx/jaha_sheet","fx/jajeon_sheet","fx/jetan_sheet","fx/jounyuk_sheet","fx/maehwageomgi_sheet","fx/maehwageomhwa_sheet","fx/maehwanobang_sheet","fx/maehwatoyeom_sheet","fx/maun_sheet","fx/milmil_sheet","fx/mueum_sheet","fx/muyeom_sheet","fx/nakha_sheet","fx/samhwan_sheet","fx/seongjin_sheet","fx/seongsan_sheet","fx/seunggi_sheet","fx/suzo_sheet","fx/talhon_cheuk_sheet","fx/talhon_gyo_sheet","fx/talhon_pierce_sheet","fx/talhon_saek_sheet","fx/unmu_sheet","fx/yakryu_sheet","item/biryong","item/bongmi","item/chwiwa","item/guyangju","item/gwiwang","item/hojeop","item/hongok","item/mukryeong","item/naengyeom","item/okru","item/saeung","item/yeongrong","item/yeoui","item/yongyeong"];
'use strict';
/* ================= 유틸 ================= */
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function wpick(items,wf){let t=0;const ws=items.map(i=>{const w=Math.max(0,wf(i));t+=w;return w});if(t<=0)return null;let r=Math.random()*t;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]}
function josa(w,pair){const c=w.charCodeAt(w.length-1)-0xAC00;const has=c>=0&&c<=11171&&c%28!==0;const[a,b]=pair.split('/');return w+(has?a:b)}
function toast(msg,ms=2600){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),ms)}
const SAVE_KEY='gunrim-roguelike-v1';
function loadMeta(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))||{cleared:[],runs:0}}catch(e){return{cleared:[],runs:0}}}
const RUN_KEY='gunrim-run-v1';
function saveRun(){
  if(!G.p||G.fxTestMode||['title','end','battle'].includes(G.screen))return;
  const s={};for(const k in G)if(k!=='meta'&&k!=='b')s[k]=G[k];
  try{localStorage.setItem(RUN_KEY,JSON.stringify({g:s,uid:UID,at:Date.now()}))}catch(e){}
}
function loadRun(){try{return JSON.parse(localStorage.getItem(RUN_KEY))}catch(e){return null}}
function clearRun(){try{localStorage.removeItem(RUN_KEY)}catch(e){}}
function saveMeta(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(G.meta))}catch(e){}}

/* ================= 난이도 ================= */
const DIFFS=[
  {id:'easy',name:'이지',desc:'적 체력 -20%, 휴식 회복 증가',ehp:.8,eatk:.9,batk:1,rest:.45,elite:1,ticket:10,req:null},
  {id:'normal',name:'노말',desc:'기준 난이도',ehp:1.1,eatk:1.05,batk:1,rest:.3,elite:1,ticket:10,req:null},
  {id:'hard',name:'하드',desc:'적 체력·공격 증가, 중간보스 등장, 뽑기권 12스테이지마다',ehp:1.45,eatk:1.1,batk:1,rest:.3,elite:1.6,ticket:12,req:null},
  {id:'hell',name:'헬',desc:'+ 보스 연전, 보스 공격력 +15%, 휴식 회복 감소',ehp:1.5,eatk:1.12,batk:1.15,rest:.25,elite:1.6,ticket:12,req:'hard'},
  {id:'extreme',name:'익스트림',desc:'+ 보스 연전, 잡념 카드, 보스 패턴 추가, 숨은 보스',ehp:1.48,eatk:1.15,batk:1.15,rest:.22,elite:1.8,ticket:15,req:'hell',junk:1,ext:1},
];

/* ================= 문파 ================= */
const FACS={
  jongnam:{n:'종남',c:'#3d7a5a',need:7,bonus:'종남 검 초식 피해 +2'},
  hwasan:{n:'화산',c:'#c0506a',need:3,bonus:'연타 초식 타격 +1회'},
  haenam:{n:'해남',c:'#2f7fa8',need:3,bonus:'매 턴 첫 검 초식 사용 시 초식 1장 뽑기'},
  seojang:{n:'서장',c:'#b8862b',need:3,bonus:'초식으로 방어를 얻을 때 무작위 적에게 피해 3'},
  soseon:{n:'소선',c:'#6a5acd',need:3,bonus:'권·장 초식이 내상 1 부여'},
  kwae:{n:'쾌의당',c:'#4a4a6a',need:3,bonus:'탈혼 표식 부여량 +1'},
  sapa:{n:'사파',c:'#8b2e2e',need:3,bonus:'공격 초식이 독 1 부여'},
  jeomchang:{n:'점창',c:'#5f8f3a',need:3,bonus:'공격을 준비 중인 적에게 피해 +3'},
  giyeon:{n:'기연',c:'#9a7b4f',need:99,bonus:''},
};

/* ================= 무공(성 단위) ================= */
const ARTS={
  jk:{n:'장괘장권구식',f:'jongnam',m6:'한 턴에 장괘 초식을 이어 쓸수록 다음 장괘 초식 피해 +3씩',m10:'매 턴 처음 쓰는 장괘 초식 내력 0'}, c36:{n:'천하삼십육검',f:'jongnam',m6:'천하 초식을 쓸 때마다 방어 +2',m10:'대성 시 천하무궁 획득'},
  yuun:{n:'유운검법',f:'jongnam',m6:'운무중첩 3연타',m10:'유운검봉이 하나로 합쳐짐(총 피해 ×1.2). 대성 시 검정중원(미완) 획득'},
  yakryu:{n:'약류장',f:'jongnam'}, nakha:{n:'낙하구구검',f:'jongnam',m6:'최절초 자하천래 획득',m10:'낙하 초식 피해 +5, 쓸 때마다 방어 +3'},
  hongdan:{n:'홍단서천',f:'jongnam'}, muyeom:{n:'무염십팔보',f:'jongnam'},
  chilji:{n:'칠지매화',f:'hwasan'},

function cutin(name,sub){
  const C=document.getElementById('cutin');if(!C||!C.animate)return;
  const band=C.querySelector('.band'),t=C.querySelector('.txt'),s=C.querySelector('.sub');
  if(!band||!t||!s)return;
  t.textContent=name;s.textContent=sub||'';C.style.display='block';
  [band,t,s,C].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
  band.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:140,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'});
  t.animate([{transform:'translateX(70px) skewX(-12deg)',opacity:0},{transform:'none',opacity:1}],{duration:180,delay:40,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'});
  s.animate([{opacity:0},{opacity:1}],{duration:200,delay:90,fill:'forwards'});
  C.animate([{opacity:1},{opacity:1,offset:.75},{opacity:0}],{duration:900,fill:'forwards'}).onfinish=()=>{C.style.display='none'};
}
function comboFor(id){
  const B=G.b;if(!B)return null;const pl=B.playedIds;
  return COMBOS.find(cb=>{const s=cb.seq;if(s[s.length-1]!==id)return false;const n=s.length-1;if(pl.length<n)return false;return s.slice(0,n).every((x,i)=>pl[pl.length-n+i]===x)})||null;
}

function syn(k){
  switch(k){
    case 'umyang':return chileumLv()===2&&guyangLv()===2;
    case 'hwabyeok':return syn('umyang')&&has('yukhap');
    case 'soseon':return has('cheondan')&&deckIds().some(i=>CARDS[i].art==='nakroe')&&deckIds().some(i=>CARDS[i].art==='guban');

    case 'dara':return (hasCard('dara1h')||hasCard('dara1'))&&hasCard('dara2')&&hasCard('dara3');
  }
  return false;
}

/* ================= 소리 ================= */
// 브라우저는 사용자가 한 번 누른 뒤에야 소리를 낼 수 있어서, 첫 클릭 때 시작한다
const SND=(()=>{
  let ac=null,master=null,sfxBus=null,musBus=null,on=false,want=null,cur=null,timer=null,step=0,nextT=0,last={};
  try{on=localStorage.getItem('gunrim-sound')==='on'}catch(e){on=false}
  const FILE={field:'audio/bgm_field.mp3',boss:'audio/bgm_boss.mp3'},fileOk={},fileEl={};
  function init(){
    if(ac)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    ac=new C();master=ac.createGain();master.gain.value=on?1:0;master.connect(ac.destination);
    sfxBus=ac.createGain();sfxBus.gain.value=.55;sfxBus.connect(master);
    musBus=ac.createGain();musBus.gain.value=.32;musBus.connect(master);
    // 파일 배경음이 있는지 미리 확인
    for(const k in FILE){const a=new Audio();a.loop=true;a.preload='auto';a.oncanplaythrough=()=>{fileOk[k]=true;if(cur===k)play(k,true)};a.onerror=()=>{fileOk[k]=false};a.src=FILE[k];fileEl[k]=a}
    if(want)play(want,true);
  }
  addEventListener('pointerdown',()=>{init();if(ac&&ac.state==='suspended')ac.resume()},{capture:true});
  let noiseBuf=null;
  function noise(){if(noiseBuf)return noiseBuf;const n=ac.sampleRate*.6,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return noiseBuf=b}
  function env(gn,t,a,peak,dec){gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(.0008,t+a+dec)}
  // 잡음 한 번: 필터 종류·주파수(시작→끝)·길이
  function burst(out,t,type,f0,f1,dur,vol,q){const s=ac.createBufferSource();s.buffer=noise();const f=ac.createBiquadFilter();f.type=type;f.Q.value=q||1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const gn=ac.createGain();env(gn,t,.004,vol,dur);s.connect(f);f.connect(gn);gn.connect(out);s.start(t);s.stop(t+dur+.05)}
  function tone(out,t,type,f0,f1,dur,vol,a){const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const gn=ac.createGain();env(gn,t,a||.004,vol,dur);o.connect(gn);gn.connect(out);o.start(t);o.stop(t+dur+.05)}
  // 타격음. 같은 소리가 한꺼번에 겹치지 않게 짧게 막는다
  function sfx(kind,power){
    if(!ac||!on)return;const t=ac.currentTime;if(last[kind]&&t-last[kind]<.045)return;last[kind]=t;
    const v=Math.min(1,.45+(power||0)/30);
    if(kind==='slash'){burst(sfxBus,t,'highpass',5200,1800,.16,.7*v,.7);tone(sfxBus,t,'triangle',2400,1500,.09,.12*v)}
    else if(kind==='blunt'){burst(sfxBus,t,'lowpass',900,180,.18,.9*v);tone(sfxBus,t,'sine',140,55,.22,.7*v)}
    else if(kind==='block'){tone(sfxBus,t,'triangle',1180,1150,.32,.28);tone(sfxBus,t,'triangle',1770,1720,.22,.16);burst(sfxBus,t,'bandpass',3000,2500,.05,.35,3)}
    else if(kind==='hurt'){burst(sfxBus,t,'lowpass',700,150,.2,.9*v);tone(sfxBus,t,'sine',110,45,.25,.8*v)}
    else if(kind==='dodge'){burst(sfxBus,t,'bandpass',700,2600,.22,.35,2)}
    else if(kind==='boom'){burst(sfxBus,t,'lowpass',1600,90,.6,1,.8);tone(sfxBus,t,'sine',90,32,.7,.9)}
  }
  // 오음계(궁상각치우). 평상시는 차분하게, 보스전은 낮고 빠르게
  const PENTA=[0,2,4,7,9],YU=[0,3,5,7,10];
  const hz=(root,scale,deg)=>root*Math.pow(2,(scale[((deg%5)+5)%5]+12*Math.floor(deg/5))/12);
  function pluck(t,f,vol,dur){// 고쟁 느낌의 뜯는 소리: 배음 두 겹 + 빠른 감쇠 + 저역 통과
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(f*6,t);lp.frequency.exponentialRampToValueAtTime(f*1.5,t+dur);lp.connect(musBus);
    tone(lp,t,'triangle',f,f,dur,vol,.003);tone(lp,t,'sawtooth',f*2.005,f*2.005,dur*.5,vol*.18,.003)}
  function flute(t,f,dur,vol){// 피리: 느린 시작과 떨림
    const o=ac.createOscillator();o.type='sine';o.frequency.value=f;const lfo=ac.createOscillator();lfo.frequency.value=5.2;const lg=ac.createGain();lg.gain.value=f*.012;lfo.connect(lg);lg.connect(o.frequency);
    const gn=ac.createGain();gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.18);gn.gain.setValueAtTime(vol,t+dur*.7);gn.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(gn);gn.connect(musBus);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05)}
  function drum(t,big){tone(musBus,t,'sine',big?95:150,big?45:80,big?.45:.2,big?.9:.45);burst(musBus,t,'lowpass',big?500:1200,120,big?.3:.12,big?.5:.3)}
  const SONG={
    field:{bpm:76,root:196,scale:PENTA,len:32,
      play(t,s,b){const bar=Math.floor(s/8)%4,prog=[0,3,4,2][bar];
        if(s%8===0)pluck(t,hz(this.root/2,PENTA,prog),.32,2.6);
        if(s%2===0)pluck(t,hz(this.root,PENTA,prog+[0,2,4,2][(s/2)%4]),.16,1.1);
        if(s%16===4||s%16===12)flute(t,hz(this.root*2,PENTA,[4,3,2,4,5,4,2,1][(s>>2)%8]),b*3.5,.08)}},
    boss:{bpm:132,root:147,scale:YU,len:32,
      play(t,s,b){const bar=Math.floor(s/8)%4,prog=[0,0,3,4][bar];
        if(s%4===0)drum(t,true);if(s%4===2)drum(t,false);if(s%8===7)drum(t+b*.5,false);
        pluck(t,hz(this.root,YU,prog+[0,2,1,2,3,2,1,2][s%8]),s%2?.11:.17,.35);
        if(s%8===0)pluck(t,hz(this.root/2,YU,prog),.34,1.4);
        if(s%16===8)flute(t,hz(this.root*2,YU,[4,3,5,2][(s>>4)%4]),b*6,.07)}}
  };
  function tick(){
    if(!ac||!cur||!SONG[cur])return;const S=SONG[cur],b=60/S.bpm/2;
    while(nextT<ac.currentTime+.25){S.play(nextT,step%S.len,b);nextT+=b;step++}
  }
  function stopAll(){clearInterval(timer);timer=null;for(const k in fileEl)fileEl[k].pause()}
  function play(k,force){
    want=k;if(!ac)return;if(cur===k&&!force)return;stopAll();cur=k;
    if(!k)return;
    if(fileOk[k]){const a=fileEl[k];a.volume=on?.55:0;a.currentTime=0;a.play().catch(()=>{});return}
    step=0;nextT=ac.currentTime+.08;timer=setInterval(tick,60);tick();
  }
  function toggle(){on=!on;try{localStorage.setItem('gunrim-sound',on?'on':'off')}catch(e){}if(master)master.gain.value=on?1:0;for(const k in fileEl)fileEl[k].volume=on?.55:0;return on}
  return{sfx,play,toggle,get on(){return on}};
})();

function newRun(diffId){
  const d=DIFFS.find(x=>x.id===diffId);
  const others=shuffle(['hwasan','haenam','seojang','soseon','kwae','sapa','jeomchang']).slice(0,4);
  G.diff=d;G.facs=['jongnam',...others];
  G.p={hp:72,max:72,gold:60,deck:[],stars:{yuun:1,jk:1,c36:1},relics:['taeeul','hyeoncheong'],weapons:[],wpn:null,banned:[],st:{},block:0,tickets:0,flags:{visited:[],spawned:[],events:[]}};
  // 처음 덱: 종남 기본 검법 유운검법 2장 + 장괘장권구식 3장 + 천하삼십육검 3장
  ['unmu','chulgok','jounyuk','yeongyang','geumgang','dodo','seongjin','bisa'].forEach(id=>G.p.deck.push({uid:UID++,id}));
  if(d.junk)G.p.deck.push({uid:UID++,id:'japnyeom'});
  G.stage=0;G.floor=0;G.b=null;G.meta.runs=(G.meta.runs||0)+1;saveMeta();
  nextFloor();

const foeIds=x=>Array.isArray(x)?x:[x],foeName=x=>foeIds(x).map(i=>EN[i].name).join('·');
function nextFloor(){
  G.floor++;G.map=genFloor();G.bossId=pick(FLOORS[G.floor].bosses);
  // 층에 들어설 때 내 초식과 이 층 보스들의 이펙트를 미리 받아 둔다
  preloadFx(G.p.deck.map(x=>x.id),[]);{const fl=G.floor;setTimeout(()=>{if(G.floor===fl)preloadFx([],FLOORS[fl].bosses)},20000)}
  {const F=FLOORS[G.floor];for(const id of new Set([...F.bosses,...(F.first||[]).flat(),...F.normals.flat(),...F.elites.flat()]))imgOk(id);if(G.p.wpn)imgOk('player_'+G.p.wpn)}
  // 중간보스: 하드부터. 1~3층은 이번 층 보스가 아닌 다른 후보, 4층은 쾌의당 수뇌나 음양쌍반진
  G.midbossId=null;
  if(!['easy','normal'].includes(G.diff.id)){
    const cand=G.floor<4?FLOORS[G.floor].bosses.filter(b=>b!==G.bossId):F4_POOL;
    G.midbossId=pick(cand);
    // 중간보스는 층 한가운데 줄을 혼자 차지해서 피해 갈 수 없다. 그 줄에 상점이 있었으면 다른 줄로 옮긴다
    const mid=Math.floor(ROWS/2),hadShop=G.map.rows[mid].some(n=>n.type==='shop');
    G.map.rows[mid]=[{lane:1,type:'midboss',mb:G.midbossId}];
    if(hadShop||!G.map.rows.some(row=>row.some(n=>n.type==='shop'))){const rr=G.map.rows[mid+2+rnd(3)];pick(rr).type='shop'}
  }
  // 보스 연전: 헬·익스트림. 1~3층은 보스 뒤에 남은 후보, 4층은 중간보스로 안 나온 둘 뒤에 야율척(3연전)
  G.bossChain=[G.bossId];
  // 보스 연전은 2층부터(1층은 중간보스만)
  if(['hell','extreme'].includes(G.diff.id)&&G.floor>=2){
    if(G.floor<4){const third=FLOORS[G.floor].bosses.find(b=>b!==G.bossId&&b!==G.midbossId);if(third)G.bossChain=[G.bossId,third]}
    else G.bossChain=[...F4_POOL.filter(b=>b!==G.midbossId),G.bossId];
  }
  G.screen='map';G.floorIntro=true;checkHidden();render();
}
const ROWS=15; // 층당 칸 수(마지막 칸이 보스)
const SCALE={hp:1.3,atk:1.15}; // 판 길이에 맞춘 적 전체 배율
function rollType(r){
  const d=G.diff;
  return wpick([['battle',46],['event',20],['shop',r>=2?9:0],['elite',r>=3?11*d.elite:0],['rest',r>=3&&r<=ROWS-4?7:0]],o=>o[1])[0];
}
function genFloor(){
  const rows=[];
  for(let r=0;r<ROWS;r++){
    if(r===ROWS-1){rows.push([{lane:1,type:'boss'}]);continue}
    const lanes=r===0?[0,1,2]:(Math.random()<.45?[0,1,2]:shuffle([0,1,2]).slice(0,2).sort());
    rows.push(lanes.map(l=>({lane:l,type:r===0?'battle':r===ROWS-2?'rest':rollType(r)})));
  }
  if(!rows.some(row=>row.some(n=>n.type==='shop')))pick(rows[2+rnd(ROWS-6)]).type='shop';
  return{rows,cur:null,battles:0};
}
function reachable(r,lane){
  const row=G.map.rows[r];if(!row||!row.some(n=>n.lane===lane))return false;
  const cur=G.map.cur;
  if(!cur)return r===0;
  if(r!==cur.r+1)return false;
  if(lane===3||cur.lane===3||row[0].type==='boss'||row[0].type==='midboss'||G.map.rows[cur.r][0].type==='midboss')return true;
  return Math.abs(lane-cur.lane)<=1;
}
function edgeOk(r,l1,l2){const a=G.map.rows[r][0].type,b=G.map.rows[r+1][0].type;return l1===3||l2===3||b==='boss'||b==='midboss'||a==='midboss'||Math.abs(l1-l2)<=1}

function starUp(art,n,why){
  if(!art)return;
  const P=G.p,before=P.stars[art]||0;
  if(before>=10){const lo=Object.keys(P.stars).filter(a=>a!==art&&P.stars[a]<10).sort((a,b)=>P.stars[a]-P.stars[b])[0];
    if(lo){toast(ARTS[art].n+' 대성의 깨달음이 '+ARTS[lo].n+'(으)로 이어진다');starUp(lo,n,why)}else{P.gold+=50;toast(ARTS[art].n+' 대성 · 은자 +50')}return}
  // 익스트림: 8성부터는 깨달음 두 번에 한 성(starProg에 반쯤 쌓인 깨달음을 둔다)
  if(G.diff&&G.diff.id==='extreme'){
    P.starProg=P.starProg||{};let s=before,pr=P.starProg[art]||0;
    for(let i=0;i<n&&s<10;i++){if(s<7)s++;else{pr++;if(pr>=2){s++;pr=0}}}
    P.starProg[art]=pr;P.stars[art]=s;
    if(s===before){toast(`${why} → ${ARTS[art].n} 깨달음 ${pr}/2 (${s+1}성까지)`);return}
  }else P.stars[art]=Math.min(10,before+n);
  const now=P.stars[art];
  toast(`${why} → ${ARTS[art].n} ${now}성`);
  if(before<6&&now>=6&&art==='nakha'&&!hasCard('jaha'))acquireCard('jaha');
  if(before<10&&now>=10){
    const rest=Object.values(CARDS).filter(c=>c.art===art&&!c.hidden&&c.type!=='junk'&&!hasCard(c.id)&&!(G.p.banned||[]).includes(c.id));
    rest.forEach(c=>P.deck.push({uid:UID++,id:c.id}));
    toast(ARTS[art].n+' 대성'+(rest.length?' — 모든 초식을 깨우쳤다: '+rest.map(c=>c.name).join(', '):''),4500);
  }
  if(before<10&&now>=10&&art==='yuun'&&!hasCard('geomjeong')&&!hasCard('geomjeong2'))acquireCard('geomjeong');
  if(before<10&&now>=10&&art==='c36'&&!hasCard('cheonhamugung'))acquireCard('cheonhamugung');
}
function acquireCard(id){
  {const d=FXDEF[id];if(d)fxImg(d.src)}
  const P=G.p,c=CARDS[id];
  if(c.type==='ult'){
    if(id==='geomjeong'&&hasCard('geomjeong2')){P.gold+=50;toast('이미 검정중원을 완성했다. 은자 +50');return}
    if(hasCard(id)){P.gold+=50;toast(`${c.name}: 이미 익혔다. 은자 +50`);return}
    if(id==='geomjeong'&&syn('hwabyeok'))id='geomjeong2';
    if(id==='dara1'&&hasCard('dara1h')){P.deck=P.deck.filter(x=>x.id!=='dara1h')}
    const before=synList();P.deck.push({uid:UID++,id});toast(`절초 ${CARDS[id].name} 획득`,3200);synCheck(before);return;
  }
  if(hasCard(id)){starUp(c.art,1,c.name+' 중복');return}
  const before=synList();
  P.deck.push({uid:UID++,id});
  if(!P.stars[c.art]){P.stars[c.art]=1;toast(`${c.name} 획득 · ${ARTS[c.art].n} 1성`)}else starUp(c.art,1,'새 초식 '+c.name);
  synCheck(before);
}
function acquireRelic(id){
  const P=G.p;if(has(id)){P.gold+=40;toast(RELICS[id].n+': 이미 있다. 은자 +40');return}
  const before=synList();P.relics.push(id);
  if(id==='cheonyang'){P.max+=6;healP(6)}
  checkYukhap();
  toast('심법·기물 획득: '+RELICS[id].n,3200);
  if(syn('hwabyeok')&&hasCard('geomjeong')){P.deck.forEach(x=>{if(x.id==='geomjeong')x.id='geomjeong2'});toast('검정중원이 완성되었다 — 나의 검정중원',4500)}
  synCheck(before);

function rewardCards(mode,n=3){
  let pool=Object.values(CARDS).filter(c=>!c.hidden&&c.type!=='junk'&&c.type!=='ult'&&G.facs.includes(facOf(c))&&cardWeight(c,mode)>0&&starOf(c.art)<10&&!(G.p.banned||[]).includes(c.id));
  const out=[];
  for(let i=0;i<n&&pool.length;i++){
    const facs=[...new Set(pool.map(facOf))];
    const f=wpick(facs,x=>(x==='jongnam'?1.5:1)*(facCount(x)>0&&x!=='jongnam'?1.3:1));
    const c=wpick(pool.filter(x=>facOf(x)===f),x=>cardWeight(x,mode));
    if(!c)break;
    out.push(c.id);
    pool=pool.filter(x=>x.art!==c.art&&!(f==='jongnam'&&facOf(x)==='jongnam'));
  }
  return out;
}

  const l=moveList(e),a=l.find(m=>m.n===c[0]),b=l.find(m=>m.n===c[1]);if(!a||!b)return null;
  const cut=m=>m.d?{...m,d:Math.max(1,Math.round(m.d*CHAIN_DMG))}:{...m};
  return{n:'연계: '+c[0]+' → '+c[1],chain:[cut(a),cut(b)],d:(a.d||0)+(b.d||0)};
}

  if(type==='elites'&&G.floor===4){
    const used=new Set([G.midbossId,...(G.bossChain||[])].filter(Boolean).flatMap(foeIds));
    list=list.filter(grp=>!grp.some(id=>used.has(id)));
    if(!list.length)list=[['kwaesal','kwaesal','kwaesal'],['sinpo','sinpo','sadae'],['seopso','wijirip']];
  }

  if(type==='elites'&&G.p.flags.samjeong==='stolen'&&!G.p.flags.dugiDone&&G.floor>=2)list.push(['dugichun'],['dugichun']);
  // 정예는 한 층에서 같은 상대를 두 번 만나지 않는다. 다 만났으면 그 층 일반 무리 둘을 합친 강한 무리가 나온다
  if(type==='elites'){const met=G.map.metE||(G.map.metE=[]),left=list.filter(grp=>!met.includes(grp.join('+')));if(!left.length){const ns=shuffle([...F.normals]);return [...ns[0],...(ns[1]||[])].slice(0,3)}list=left;const gp=pick(list);met.push(gp.join('+'));return gp}

function calcDmg(c,t){
  const P=G.p,st=starOf(c.art);
  let b=c.dmg||0;
  // 6성 보너스: 여러 번 때리는 초식은 한 번에 +2(한 번만 때리면 +3)
  if(c.art&&st>=6)b+=hitsOf(c)>1?2:3;
  b+=P.st.str||0;
  if(c.tags.includes('s')&&wpn('yongyeong'))b+=2;
  if((c.tags.includes('f')||c.tags.includes('p'))&&wpn('mukryeong'))b+=3;
  if(syn('soseon')&&(c.tags.includes('f')||c.tags.includes('p')))b+=3;
  if(facSyn('jongnam')&&c.tags.includes('s')&&facOf(c)==='jongnam')b+=2;
  if(c.art==='talhon'&&chileumLv()===2)b+=Math.min(5,P.st.yinmaek||0);
  if(P.st.nextAtk&&c.type!=='def')b+=P.st.nextAtk;
  if(facSyn('jeomchang')&&t&&t.intent&&t.intent.d)b+=3;
  if(c.art==='jk'&&st>=6&&G.b)b+=3*(G.b.jkN||0);
  if(c.art==='nakha'&&st>=10)b+=5;
  if(c.dmgFn)b=c.dmgFn(b,t,st);
  const cb=G.b&&G.b.curCombo;if(cb&&cb.add)b+=cb.add;
  const sa=c.art?st:c.ultArt?starOf(c.ultArt):0;
  let m=sa?1+.08*(Math.max(1,sa)-1):1;
  if(G.b&&G.b.chainArt===c.art&&G.b.chainN>=2&&c.art)m*=Math.min(1.3,1+.08*(G.b.chainN-1));
  if(cb&&cb.mul)m*=cb.mul;
  if(P.st.weak)m*=.75;
  if(t){
    if(t.st.vuln)m*=1.5;
    if(t.analyzed&&t.analyzed===c.art)m*=.5;
    if(t.id==='yayul'&&(c.art==='nakjeon'||c.id==='jajeon'))m*=1.5;
  }
  return Math.max(0,Math.floor(b*m));
}

function cardDesc(c){
  const p=[];const inB=!!G.b;
  if(c.dmg){const t=inB?curTarget():null;const d=inB?calcDmg(c,t):c.dmg;const h=G.p?hitsOf(c):(c.hits||1);p.push(`피해 <b>${d}</b>${h>1?' × '+h:''}${c.all?' (전체)':''}${c.pierce?' · 방어 무시':''}`)}
  if(c.block){const b=blockOf(c);p.push(`방어 <b>${b}</b>`)}
  if(c.ap)for(const k in c.ap)p.push(`${SN[k]} ${c.ap[k]}${c.all?' (전체)':''}`);
  if(c.self)for(const k in c.self)if(k!=='nextAtk'&&k!=='counter')p.push(`자신 ${SN[k]} ${c.self[k]}`);
  if(c.draw)p.push(`초식 ${c.draw}장 뽑기`);
  if(c.text)p.push(c.text);
  if(c.type==='ult')p.push('<i>절초 · 전투당 1회</i>');
  return p.join('<br>');
}
function cardHTML(c,onclick,extraCls='',showOwned=false){
  const f=facOf(c),st=c.art?starOf(c.art):0;
  const meta=c.art?`${ARTS[c.art].n}${st?' '+st+'성':''} · ${FACS[f].n}`:(c.type==='ult'?'절초 · '+FACS[f].n:'');
  const tp={atk:'공격',def:'방어',skill:'보법·기술',ult:'절초',junk:'잡념'}[c.type];
  const cost=c.type==='junk'?'-':(G.p?costOf(c):c.cost);
  const own=showOwned&&G.p&&hasCard(c.id)?`<div class="owned">${c.art?`보유 · 고르면 ${ARTS[c.art].n} +1성`:'보유 · 고르면 은자 +50'}</div>`:'';
  return `<div class="card ${c.rar} ${c.type==='ult'?'ult':''} ${extraCls}" onclick="${onclick||''}"><div class="fbar" style="background:${FACS[f].c}"></div><div class="cost">${cost}</div><div class="ctype">${tp}</div><div class="cname">${c.name}</div><div class="cmeta">${meta}</div><div class="cdesc">${cardDesc(c)}</div>${own}</div>`;

function stHTML(st,block){
  let s=block?`<span class="st blk" title="방어">방어 ${block}</span>`:'';
  for(const k in st){if(!st[k]||!SN[k])continue;
    // 탈혼 표식·음기는 터지는 문턱까지 같이 보여 준다
    if(k==='mark'&&G.b){const th=markTh(),near=st[k]>=th-2;s+=`<span class="st mark${near?' near':''}" title="${th}개가 되면 심장 관통">탈혼 ${st[k]}/${th}</span>`;continue}
    if(k==='yin'&&G.b){const th=(chileumLv()>=2?8:10)-(wpn('yeongrong')?2:0);s+=`<span class="st yin" title="${th}이 되면 빙결">음기 ${st[k]}/${th}</span>`;continue}
    s+=`<span class="st" title="${SD[k]||''}">${SN[k]} ${st[k]}</span>`}

}
function intentParts(e,m){
  const parts=[];
  if(m.d){const d=enemyDmg(e,m);parts.push(`⚔ ${d}${m.h>1?'×'+m.h:''}`)}
  if(m.b)parts.push(`방어 ${m.b}`);
  if(m.sf||m.heal)parts.push(m.heal?'회복':'강화');
  if(m.ap)parts.push('▼'+Object.keys(m.ap).map(k=>SN[k]).join('·'));
  if(m.pm)parts.push('탈혼');
  return parts.join(' ');
}
function intentHTML(e){
  const m=e.intent;if(!m)return'';
  if(e.st.frozen)return'<div class="intent def">빙결</div>';
  if(m.chain)return `<div class="intent chain" title="${m.n}">연계<br>${m.chain.map(s=>`${s.n} ${intentParts(e,s)}`).join('<br>')}</div>`;
  const parts=[];let cls='';
  if(m.d){const d=enemyDmg(e,m);parts.push(`⚔ ${d}${m.h>1?'×'+m.h:''}`)}
  if(m.b){parts.push(`방어 ${m.b}`);if(!m.d)cls='def'}
  if(m.sf||m.heal){parts.push(m.heal?'회복':'강화');if(!m.d&&!m.b)cls='buf'}
  if(m.ap)parts.push('▼'+Object.keys(m.ap).map(k=>SN[k]).join('·'));
  if(m.pm)parts.push('탈혼');
  return `<div class="intent ${cls}" title="${m.n}">${m.n}<br>${parts.join(' ')}</div>`;
}

  gacha:()=>{if(G.p.gold<60)return;G.p.gold-=60;const id=gachaDraw();modal(`<h3>비급 뽑기</h3><div class="cards">${cardHTML(CARDS[id])}</div><div class="row" style="justify-content:center"><button onclick="A.close()">확인</button></div>`);acquireCard(id);render()},
  shopRemove:()=>{if(G.shop.removed||G.p.gold<70)return;openRemove(()=>{G.p.gold-=70;G.shop.removed=true;render()})},
  removeCard:uid=>{const after=G.afterRemove;G.afterRemove=null;closeModal();if(uid){const x=G.p.deck.find(d=>d.uid===uid);G.p.deck=G.p.deck.filter(d=>d.uid!==uid);if(!G.p.banned.includes(x.id))G.p.banned.push(x.id);toast(CARDS[x.id].name+'을(를) 버렸다');if(after)after()}else if(G.screen==='event')completeNode();else render()},
  potion:()=>{const S=G.shop,pr=35+20*(S.potionN||0);if(G.p.gold<pr||G.p.hp>=G.p.max)return;G.p.gold-=pr;S.potionN=(S.potionN||0)+1;healP(Math.round(G.p.max*.25));S.pick=null;render()},
  wine:()=>{if(G.p.flags.wine||G.p.gold<25)return;G.p.gold-=25;G.p.flags.wine=true;toast('술을 샀다. 어딘가에서 인연이 닿을지도 모른다.');render()},
  leave:()=>completeNode(),
  rest:k=>{const P=G.p;if(k==='heal')healP(Math.round(P.max*G.diff.rest));if(k==='samjeong'){P.max+=16;healP(16);P.flags.samjeong='eaten2';toast('만년삼정을 복용했다. 임독양맥에 기운이 돈다.',3500)}completeNode()},
  train:a=>{starUp(a,a==='yuun'&&wpn('yongyeong')?2:1,'수련');completeNode()},
  equip:w=>{if(G.b)return;G.p.wpn=w;toast(WEAPONS[w].n+'을(를) 들었다');modal(bookHTML());render()},
  buyWeapon:()=>{const S=G.shop;if(!S.weapon||S.wsold||G.p.gold<160)return;G.p.gold-=160;S.wsold=true;acquireWeapon(S.weapon);G.shop.pick=null;render()},
  buyRelic:(r,pr)=>{if(G.p.gold<pr||has(r))return;G.p.gold-=pr;acquireRelic(r);if(G.shop)G.shop.pick=null;render()},
  ticket:()=>{if(!G.p.tickets||G.screen!=='map')return;const pool=ticketPool(),opts=[];
    // 아직 모을 심법이 남아 있으면 세 가지 중 하나는 반드시 심법(반쪽을 가진 칠음진기·구양신공의 나머지가 먼저 나오기 쉽다)
    const rel=pool.filter(x=>x.k==='relic');if(rel.length){const r=wpick(rel,x=>x.w);opts.push(r);pool.splice(pool.indexOf(r),1)}
    while(opts.length<3&&pool.length){const r=wpick(pool,x=>x.w);opts.push(r);pool.splice(pool.indexOf(r),1)}
    opts.sort(()=>Math.random()-.5);G.tk={res:null,opts};G.screen='ticket';render()},
  tkPick:i=>{if(G.tk.res)return;const r=G.tk.opts[i]||G.tk.opts[0];if(!r)return;G.p.tickets--;G.tk.res=r;if(r.k==='card')acquireCard(r.id);else acquireRelic(r.id);render()},
  tkDone:()=>{G.screen='map';checkHidden();render()},
  campRemove:uid=>{const C=G.camp;if(!C||C.left<=0)return;const x=G.p.deck.find(d=>d.uid===uid);if(!x)return;G.p.deck=G.p.deck.filter(d=>d.uid!==uid);if(!G.p.banned.includes(x.id))G.p.banned.push(x.id);C.left--;toast(CARDS[x.id].name+'을(를) 버렸다');render()},
  campEquip:w=>{G.p.wpn=w;toast(WEAPONS[w].n+'을(를) 들었다');render()},
  campDone:()=>{G.camp=null;nextFloor()},
  book:()=>modal(bookHTML()),
  help:()=>modal(HELP),
  close:()=>closeModal(),
};
// 주소 끝에 #연출 을 붙이면 이펙트 시험 전투로 바로 들어간다
render();
</script>
</body>
</html>
